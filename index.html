<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRESTIN ARTIS</title>
  <link rel="icon" href="favicon.ico" sizes="any"> <!-- from the Cargo site -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } /* iOS would enlarge text when the phone turns sideways */
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: default; }
    canvas.grab    { cursor: grab; }
    canvas.grabbing { cursor: grabbing; }
    canvas.pop     { cursor: pointer; }
    #glass { position: fixed; inset: 0; pointer-events: none; }
    #glass[hidden] { display: none; }
    #pop-hint { position: fixed; z-index: 3; pointer-events: none; color: #111; display: flex; flex-direction: column; align-items: flex-start;
      font: 26px/1 'Gaegu', 'Comic Sans MS', cursive; opacity: 0; transition: opacity .5s; }
    #pop-hint span { transform: rotate(-5deg); margin-left: 18px; }
    #pop-hint svg { width: 46px; height: 36px; margin-top: 2px; transform: scaleX(-1); overflow: visible; }
    #pop-hint path { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 80; stroke-dashoffset: 80; transition: stroke-dashoffset .6s .3s ease-out; }
    #pop-hint.show { opacity: 1; }
    #pop-hint.show path { stroke-dashoffset: 0; } /* `canvas{display:block}` would otherwise override [hidden] */

    footer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; /* its buttons stay usable over Info */
      padding: 18px 22px calc(18px + env(safe-area-inset-bottom, 0px));
      /* three columns so Projects sits on the true centre, whatever the side widths */
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      pointer-events: none;
      font-family: sans-serif; font-size: 11px; color: #111; letter-spacing: 0.04em;
    }
    footer > * { pointer-events: auto; }
    #info-btn { justify-self: end; }
    #info-btn, #projects-btn, #soon-btn {
      background: none; border: none; cursor: pointer;
      font: inherit; color: inherit; letter-spacing: inherit;
      padding: 10px 12px; margin: -10px -12px; /* bigger tap target, same layout */
    }

    /* Projects: a sheet that slides up behind the footer */
    #projects { position: fixed; inset: 0; pointer-events: none; }
    /* only the sheet takes taps, so letters around it stay draggable */
    #projects.open .sheet { pointer-events: auto; }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: min(78vh, 760px);
      background: #fff; box-shadow: 0 -8px 40px rgba(0,0,0,.10);
      transform: translateY(100%); transition: transform .45s cubic-bezier(.2,.8,.2,1);
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 36px 22px calc(72px + env(safe-area-inset-bottom, 0px));
      font-family: sans-serif; color: #111;
    }
    #projects.open .sheet { transform: translateY(0); }
    /* while the sheet is up, the footer turns solid so cards scroll under it, not through its text */
    footer { transition: background-color .45s; }
    #projects.open ~ footer { background: #fff; }
    .sheet h2 {
      font-size: 11px; font-weight: normal; letter-spacing: 0.04em; text-transform: uppercase;
      max-width: 1200px; margin: 0 auto 24px;
    }
    .project-grid {
      /* three across on desktop (the six projects read as two rows of three), two on tablets, one on phones */
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px 20px; max-width: 1200px; margin: 0 auto;
    }
    @media (max-width: 860px) { .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 543px) { .project-grid { grid-template-columns: 1fr; } }
    .project { font-size: 13px; line-height: 1.5; }
    .project .thumb { aspect-ratio: 4 / 3; background: #ece9e2; margin-bottom: 10px; }
    .project .thumb img, .project .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .project .meta { font-size: 11px; color: #777; letter-spacing: 0.04em; }
    /* one card per row (phone): cover runs nearly edge to edge */
    @media (max-width: 543px) {
      .sheet { padding-left: 8px; padding-right: 8px; }
      .sheet h2, .project p { padding: 0 6px; }
      .project-grid { gap: 36px; }
    }
    @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }

    /* projectorgv5: the list fills the page below the masthead band; its slide is driven by the
       stage so its top edge rides the letters' floor (no CSS transition to race ahead of it) */
    .sheet { top: var(--sheet-top, 26vh); height: auto; transition: none; }

    /* projectorgv6: the sheet shows the list or one case study (which one follows the address) */
    .project { display: block; color: inherit; text-decoration: none; }
    #project-view[hidden], #list-view[hidden] { display: none; }
    /* projectorgv7 cohesion pass: one 12-column grid, one gutter, one corner radius, one type size.
       Media never stretches past its own pixel width (--max), so a small file is paired in a row
       in projects.json instead of being upscaled to fill. The side margins grow with the window
       (4.5vw counting the sheet's own 22px, as on malaikafrancique.com) and there is no cap: the work
       fills the screen at any size (1310px of content at 1440, 1638 at 1800). On a screen wider than a
       file, that file sits at its own width, centred, rather than being stretched. */
    .case { --gut: 20px; --igut: 35px; --r: 8px; --grey: #777;
      box-sizing: content-box; margin: 0 auto; padding-inline: max(0px, 4.5vw - 22px);
      font-size: 14px; line-height: 1.55; }
    .case a { color: inherit; }
    .case .back { display: inline-block; color: var(--grey); text-decoration: none; padding: 10px 12px; margin: -10px -12px 14px; }
    .case figure { margin: 0; }
    .case .m { display: block; width: 100%; height: auto; background: #f3f3f3; border-radius: var(--r); }
    /* full column width, capped at the file's own width: a grid item with auto margins would
       otherwise shrink to whatever has loaded (0 before a lazy image, the poster before a video) */
    .case .m-wrap { width: 100%; max-width: var(--max, none); margin: 0 auto; }
    /* inset: the media sits smaller inside its own black ground, with the cut-off top and bottom faded out */
    .case .m-inset { position: relative; }
    .case .m-inset .m { background: #000; box-sizing: border-box; object-fit: contain; padding: var(--pad); }
    .case .m-inset::before { content: ''; position: absolute; inset: 0; border-radius: var(--r); pointer-events: none; z-index: 1;
      background: linear-gradient(#000 var(--edge), transparent calc(var(--edge) + 12%), transparent calc(100% - var(--edge) - 12%), #000 calc(100% - var(--edge))); }
    /* frame: a thin white rounded square around the inset media, like a watch face */
    .case .m-frame { position: absolute; inset: calc(var(--edge) - 12px); z-index: 1; pointer-events: none;
      border: 1.5px solid rgba(255,255,255,.75); border-radius: 22%; }
    /* hero, then the introduction in three equal columns, as on malaikafrancique.com: the title highlighted in the letters' pink with
       the type a line below | the text | credits in grey, right-aligned, without labels */
    .case-head { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px var(--igut);
      margin: 48px 0 72px; line-height: 1.4; }
    .case-head h1 { font-size: inherit; font-weight: normal; line-height: inherit; }
    .case-head h1 .title { background: #E7006A; color: #fff; padding: 0 .15em;
      -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .case-head h1 .type { display: block; margin-top: 1.2em; }
    .case-text { max-width: 62ch; }
    .case-text p + p { margin-top: .8em; }
    .case-meta { text-align: right; color: var(--grey); }
    .case-meta dt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .case-meta a { text-decoration: underline; text-underline-offset: 2px; }
    .blocks { display: grid; gap: var(--gut); }
    .b-row { display: flex; gap: var(--gut); align-items: flex-start; }
    .b-row > figure { flex: var(--ar) 1 0; min-width: 0; }
    .b-cols { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gut); align-items: start; }
    .b-cols > div { grid-column: span var(--span); display: grid; gap: 12px; }
    .b-cols h3 { font-size: inherit; }
    /* a quote sits in the introduction's middle column, at the same size as the text */
    .b-quote { margin: 32px 0 32px calc((100% - 2 * var(--igut)) / 3 + var(--igut)); width: calc((100% - 2 * var(--igut)) / 3);
      line-height: 1.4; color: var(--grey); }
    /* the closing writing sits on the introduction's three columns, the quote in the middle one */
    .case-notes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px var(--igut);
      margin-top: 72px; line-height: 1.4; }
    .case-notes .quote { grid-column: 2; color: var(--grey); }
    .case-notes .quote + div { grid-column-start: 1; } /* the sections start their own row under it */
    .case-notes h3 { font-size: inherit; margin-bottom: .4em; }
    /* the hidden About page: the self-portrait under the title (strokes draw, then the exact ink
       fades in), the photo under the bio, then each project's title highlighted in its own colour */
    .portrait { width: min(170px, 42vw); margin-top: 36px; color: #111; position: relative; }
    /* "← me btw": a hand-drawn arrow and a marker note beside the head, drawn once the portrait is done */
    .portrait .btw { position: absolute; left: 78%; top: 2%; display: flex; align-items: center; gap: 2px;
      font: 22px/1 'Gaegu', 'Comic Sans MS', cursive; white-space: nowrap; opacity: 0; transition: opacity .4s .5s; }
    .portrait .btw svg { width: 46px; height: 22px; overflow: visible; }
    .portrait .btw path { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 80; stroke-dashoffset: 80; transition: stroke-dashoffset .5s ease-out; }
    .portrait.done .btw { opacity: 1; transition-delay: 0s; }
    .portrait.done .btw path { stroke-dashoffset: 0; }
    .portrait.done .btw span { animation: btw-in .4s .35s both; }
    .portrait .btw span { position: relative; }
    .portrait .btw .to-photo { display: none; } /* phone only: from under "me" toward the photo beside it */
    @keyframes btw-in { from { opacity: 0; transform: translateX(-4px) rotate(-4deg); } to { opacity: 1; transform: rotate(-4deg); } }
    .portrait svg { display: block; width: 100%; height: auto; }
    .portrait .ink { opacity: 0; transition: opacity .5s; }
    .portrait .strokes { transition: opacity .5s; }
    .portrait.done .ink { opacity: 1; }
    .portrait.done .strokes { opacity: 0; }
    .case .case-meta .about-photo { width: min(280px, 100%); margin: 28px 0 0 auto; }
    .about-photo img { width: 100%; height: auto; }
    /* phone: a smaller drawing beside the photo, above the title */
    @media (max-width: 543px) {
      .about-top { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; margin-top: 8px; }
      .portrait { width: 56%; margin-top: 0; align-self: center; } /* centred on the photo's height, not standing on its bottom */
      .portrait .btw { font-size: 17px; }
      .portrait .btw svg { width: 32px; height: 16px; }
      .portrait .btw .to-photo { display: block; position: absolute; left: 6px; top: calc(100% - 1px); width: 80%; height: 14px; }
      .portrait.done .btw .to-photo path { transition-delay: .7s; }
      .case .about-photo { margin: 0; }
      .about-top + .case-head { margin-top: 40px; }
    }
    .about-work { display: grid; gap: 14px; margin-bottom: 72px; }
    .about-work a { text-decoration: none; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
    .about-work .title { color: #fff; padding: 0 .15em; }
    .about-work .type { color: var(--grey); }
    .next { display: block; margin-top: 72px; padding-top: 18px; border-top: 1px solid #eee; text-decoration: none; }
    .next span { color: var(--grey); }
    .next strong { display: block; margin-top: 2px; }
    .next-app { display: flex; gap: 14px; align-items: center; }
    .next-app img { width: 48px; height: 48px; border-radius: 22.5%; flex: none; }
    .next-app span { display: block; }
    .next .next-sub { color: var(--grey); margin-top: 2px; }
    @media (max-width: 860px) { /* tablet: title and credits share the top row, the text runs full width below */
      .case-head { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .case-text { grid-column: 1 / -1; grid-row: 2; }
      .b-quote { margin-left: 0; width: auto; }
      .case-notes { grid-template-columns: 1fr; gap: 24px; }
      .case-notes .quote { grid-column: auto; }
    }
    /* images fade up as they first scroll into view, after malaikafrancique.com's Cargo setting
       (scrollTransitionFadeUp-3: from 50px low and transparent), stretched over the whole 1.2s with a
       long ease-out so it settles gently instead of snapping in */
    /* ticker (phone): after the auto-scrolling strip at the foot of malaikafrancique.com/raggamuffin
       (Cargo's marquee-set, pointer-interaction on). The images run edge to edge at 38% of the
       screen's height (never past a file's own height) and loop seamlessly (the track holds them
       three times). It is the phone's own sideways scroll, so swiping, flinging and tapping feel
       native; script only adds the slow drift while nobody is touching it */
    .b-ticker { overflow-x: auto; overflow-y: hidden; margin-inline: -16px; scrollbar-width: none; overscroll-behavior-x: contain; }
    .b-ticker::-webkit-scrollbar { display: none; }
    .b-ticker .track { display: flex; gap: var(--gut); padding-right: var(--gut); width: max-content; }
    .case .b-ticker figure { flex: none; height: min(38vh, var(--h)); aspect-ratio: var(--ar); width: auto; max-width: none; }
    .case .b-ticker .m { width: 100%; height: 100%; -webkit-user-drag: none; }
    /* panorama (phone): a very wide piece shown at 40% of the screen's height, edge to edge, gliding
       slowly from one end to the other and back; it is native sideways scroll, so a finger can pan it */
    .b-pano { overflow-x: auto; overflow-y: hidden; margin-inline: -16px; scrollbar-width: none; overscroll-behavior-x: contain; }
    .b-pano::-webkit-scrollbar { display: none; }
    .case .b-pano figure { height: min(40vh, var(--h)); aspect-ratio: var(--ar); width: auto; max-width: none; }
    .case .b-pano .m { width: 100%; height: 100%; }
    @keyframes case-fade-up {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: none; }
    }
    .case .blocks figure.fade-wait { opacity: 0; }
    .case .blocks figure.fade-in { animation: case-fade-up 1200ms cubic-bezier(.22, .61, .36, 1) both; }
    .zoomable { cursor: zoom-in; }
    /* protect: no zoom, no drag, no save-image menu (right-click or long-press reaches the figure, not the image) */
    .m-protect .m { pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; }
    #zoom { position: fixed; inset: 0; z-index: 10; background: rgba(255,255,255,.96); display: flex;
      align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
    #zoom[hidden] { display: none; }
    #zoom img, #zoom video { max-width: 100%; max-height: 100%; object-fit: contain; }
    /* phone, after malaikafrancique.com's: images and text share one 16px edge (the sheet's 8px plus
       8px), the introduction is set small and tight, and the credits stay grey on the right */
    @media (max-width: 543px) {
      .case { --gut: 12px; font-size: 13.5px; letter-spacing: -.01em; padding-inline: 8px; }
      .case-head { grid-template-columns: 1fr; gap: 0; margin: 56px 0; line-height: 1.2; }
      .case-head > * { grid-column: 1 / -1 !important; grid-row: auto !important; }
      .case-head h1 .type { margin-top: 1.4em; }
      .case-text { margin-top: 10px; }
      .case-meta { margin-top: 40px; }
      .case-notes { margin-top: 56px; line-height: 1.3; }
      .b-row:not(.keep) { flex-direction: column; }
      .b-row:not(.keep) > figure { width: 100%; }
      .b-cols > div { grid-column: span 12; }
      .b-cols > div:empty { display: none; }
    }



    #about, #soon {
      position: fixed; inset: 0; z-index: 5; /* above the projects sheet, which comes later in the page */
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    #about.open, #soon.open { opacity: 1; pointer-events: auto; }
    #soon h2 { font-size: inherit; font-weight: bold; margin-bottom: 14px; }
    #soon ul { list-style: none; display: grid; gap: 14px; }
    #soon a { text-decoration: none; }
    #soon .app { display: flex; gap: 14px; align-items: flex-start; }
    #soon .app img { display: block; width: 56px; height: 56px; border-radius: 22.5%; flex: none; } /* the App Store icon, iPhone corners */
    #soon-btn { justify-self: start; }
    #about-link { font-weight: bold; text-decoration: none; }
    .ig-link { text-decoration: none; }
    /* hovering an Instagram link (mouse only) shows the live profile, from Instagram's own embed */
    #ig-preview { position: fixed; z-index: 8; width: 340px; height: 374px; border-radius: 8px; overflow: hidden;
      background: #fff; box-shadow: 0 8px 40px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .2s; }
    #ig-preview.show { opacity: 1; pointer-events: auto; }
    #ig-preview iframe { width: 100%; height: 100%; border: 0; }
    #about .ig { vertical-align: -.15em; margin-right: .35em; } /* the Instagram glyph, drawn in the link's colour */
    .card {
      background: #fff; padding: 48px 44px; max-width: 420px; width: 90%;
      box-shadow: 0 8px 40px rgba(0,0,0,.12);
      font-family: sans-serif; font-size: 13px; line-height: 1.7; color: #111;
    }
    .card a { color: inherit; }
    .links { list-style: none; margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 20px; }
  </style>
</head>
<body>
  <canvas id="letters"></canvas>
  <canvas id="glass" hidden></canvas>
  <div id="pop-hint" aria-hidden="true"><span>pop me</span><svg viewBox="0 0 50 40"><path d="M6 4 C4 18 14 30 40 34 M33 28 L41 34 L33 39"/></svg></div>

  <!-- "VCD / UX / UI" in the footer opens this: what Prestin is working on now, like Info -->
  <section id="soon" aria-hidden="true">
    <div class="card">
      <h2>Currently working on</h2>
      <!-- what Prestin is working on now, one <li> each -->
      <ul>
        <li class="app"><a href="https://apps.apple.com/us/app/pelicula/id6763131679" target="_blank" rel="noopener"><img src="soon/pelicula-icon.png" width="56" height="56" alt=""></a>
          <div><a href="https://apps.apple.com/us/app/pelicula/id6763131679" target="_blank" rel="noopener"><strong>Pelicula</strong> ↗︎</a><br>
          An iPhone app I built to rank and track the films you've seen. Out now on the App Store.</div></li>
        <li>More on the way.</li>
      </ul>
    </div>

  <section id="about" aria-hidden="true">
    <div class="card">
      <p>Prestin Artis is a VCD / UX / UI designer.</p>
      <ul class="links">
        <li><a href="mailto:partisuw@gmail.com">partisuw@gmail.com</a></li>
        <li><a href="https://www.instagram.com/iprestin/" class="ig-link" target="_blank" rel="noopener" aria-label="Instagram: @iprestin"><svg class="ig" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>@iprestin</a></li>
        <li><a href="#/about" id="about-link">About</a></li>

  <section id="projects" aria-hidden="true" inert>
    <div class="sheet" role="dialog" aria-label="Projects">

        <h2>Projects</h2>
        <!-- cards come from projects.json, in its order -->

      <div id="project-view" hidden></div>
    </div>

  <div id="ig-preview" aria-hidden="true"></div>
  <div id="zoom" hidden><img alt=""><video muted loop playsinline hidden></video></div>

  <footer>
    <button id="soon-btn" aria-controls="soon" aria-expanded="false">VCD / UX / UI</button>
    <button id="projects-btn" aria-expanded="false" aria-controls="projects">Projects</button>
    <button id="info-btn">Info</button>
  </footer>



<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ArtisType — stroke-particle soft-body engine for hand-drawn letters.
   Each letter is built from its SVG stroke paths as a chain of particles held
   by distance links, curvature springs and shape recovery; letters collide
   through a spatial hash. Exposed as window.ArtisType = {Glyph, World}.
   ═══════════════════════════════════════════════════════════════════════════ */
(() => {
  'use strict';
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  class Glyph {
    constructor(shape,pose,index,customStrokes){
      const packing=Math.min(pose.packingCap||1.32,pose.packingScale||1);
      this.char=shape.char;this.index=index;this.w=pose.w*packing;this.h=pose.h*packing;this.angle=pose.angle||0;
      this.nodes=[];this.paths=[];this.links=[];this.bounds={};this.cx=pose.x;this.cy=pose.y;
      this.radius=Glyph.strokeRadius(this.char,this.w,this.h);
      const co=Math.cos(this.angle),si=Math.sin(this.angle);
      for(const stroke of customStrokes){
        const local=stroke.points.map(p=>({x:p.x*this.w,y:p.y*this.h}));
        let length=0;const lengths=[0];for(let i=1;i<local.length;i++){length+=Math.hypot(local[i].x-local[i-1].x,local[i].y-local[i-1].y);lengths.push(length)}
        const count=Math.max(3,Math.ceil(length/(this.radius*.6))),path=[];
        for(let i=0;i<=count;i++){
          if(stroke.closed&&i===count)break;
          const distance=length*i/count;let j=1;while(j<lengths.length-1&&lengths[j]<distance)j++;
          const t=(distance-lengths[j-1])/(lengths[j]-lengths[j-1]||1);
          const lx=local[j-1].x+(local[j].x-local[j-1].x)*t,ly=local[j-1].y+(local[j].y-local[j-1].y)*t;
          const reach=this.radius*(!stroke.closed&&(i===0||i===count)?1.1:.28);
          let n=null,best=reach;for(const m of this.nodes){const d=Math.hypot(m.lx-lx,m.ly-ly);if(d<best){n=m;best=d}}
          if(!n){const ox=lx*co-ly*si,oy=lx*si+ly*co;n={body:this,lx,ly,ox,oy,x:pose.x+ox,y:pose.y+oy,vx:0,vy:0,rx:this.radius,ry:this.radius};this.nodes.push(n)}
          if(path.at(-1)!==n)path.push(n);
        }

  const hexRGB = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  const N_INK = 12;
  let inkRGB = Array.from({ length: N_INK }, () => hexRGB(COLOR)), ink = inkRGB.map(() => COLOR), inkRaf = 0;
  function setInk(color) {
    let list = [].concat(color || []).filter(c => /^#[0-9a-f]{6}$/i.test(c)); // a project without a colour just stays pink
    if (!list.length) list = [COLOR];
    const from = inkRGB.map(c => c.slice());
    const to = from.map((c, i) => hexRGB(list[i % list.length])), t0 = performance.now();
    cancelAnimationFrame(inkRaf);
    const tick = t => {
      const k = Math.min(1, (t - t0) / 700), e = k * k * (3 - 2 * k);
      inkRGB = from.map((c, j) => c.map((v, i) => v + (to[j][i] - v) * e));
      ink = inkRGB.map(c => `rgb(${c.map(Math.round).join(',')})`);

  /* ── Mode B visual animation ─────────────────────────────────────────── */
  let _mbAnim=null; // {startMs, glyphs:[{g, fromNodes, toNodes, cx, cy, deltaAngle}]}
  let _animOnly=false; // true once physics sleeps but animation is still running
  const MB_ANIM_MS=280;

  function _mbSpring(t){
    // Elastic ease-out: goes slightly past 1.0 then settles
    if(t<=0)return 0;if(t>=1)return 1;
    return Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1;
  }

  function cancelModeBAnim(){
    if(!_mbAnim)return;
    if(world)for(const n of world.nodes){n._animX=null;n._animY=null;}
    _mbAnim=null;
  }

  function tickModeBAnim(){
    if(!_mbAnim||!world)return;
    const t=(performance.now()-_mbAnim.startMs)/MB_ANIM_MS;
    if(t>=1){
      for(const n of world.nodes){n._animX=null;n._animY=null;}
      // Mark animated glyphs dirty so draw() rebuilds them at exact physics positions
      for(const d of _mbAnim.glyphs) d.g._pathDirty=true;
      _mbAnim=null;
      return;
    }
    const s=_mbSpring(t);
    for(const d of _mbAnim.glyphs){
      const cx=d.cx,cy=d.cy;
      const amp=Math.min(Math.abs(d.deltaAngle)*1.4,0.18);
      const dir=d.deltaAngle>=0?1:-1;
      const extraAngle=dir*amp*Math.exp(-5*t)*Math.sin(3.2*Math.PI*t);
      const cosR=Math.cos(extraAngle),sinR=Math.sin(extraAngle);
      for(let i=0;i<d.g.nodes.length;i++){
        const n=d.g.nodes[i];
        // Converge to live physics position, not frozen frame-38 snapshot
        const px=d.fromNodes[i].x+(n.x-d.fromNodes[i].x)*s;
        const py=d.fromNodes[i].y+(n.y-d.fromNodes[i].y)*s;
        const dx=px-cx,dy=py-cy;
        n._animX=cx+dx*cosR-dy*sinR;
        n._animY=cy+dx*sinR+dy*cosR;
      }
      d.g._pathDirty=true; // per-glyph dirty: only rebuilt letters need new paths
    }
  }

  class Replay {
    constructor(){

    startReplayCore(){
      if(!this._events||!this._events.length)return;
      if(this._snap&&world&&world.nodes.length===this._snap.nodes.length){
        this._snap.nodes.forEach((s,i)=>{world.nodes[i].x=s.x;world.nodes[i].y=s.y;world.nodes[i].vx=s.vx;world.nodes[i].vy=s.vy;});
        world.glyphs.forEach((g,i)=>{g._rdx=this._snap.rdx[i]||0;g._rdy=this._snap.rdy[i]||0;g.update();});

        }
      }

    startReplay(){
      if(!this._events||!this._events.length)return;

    tick(){
      if(!this.replaying)return;
      this._replayFrameCount++;

      while(this._replayIdx<this._events.length&&
            this._events[this._replayIdx].f-firstF<=this._replayFrameCount){
        const ev=this._events[this._replayIdx++];
        if(ev.type==='down'){const g=hit({x:ev.x,y:ev.y});if(g){world?.grab(g,{x:ev.x,y:ev.y});g.z=++topZ;}}

        else if(ev.type==='resize'){_replayResize(ev.x,ev.y);}
      }
      if(this._replayIdx>=this._events.length){this.replaying=false;world?.release();}

  const replay=new Replay();

  function _replayResize(w,h){
    const nW=Math.max(40,w),nH=Math.max(40,h);
    if(nW===width&&nH===height)return;
    width=nW;height=nH;
    canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
    world.resize(width,height);
    renderDirty=true;

  /* ── Rotation-aware bbox of a composition ────────────────────────────── */
  function compBBox(compIdx) {
    const comp = COMPS[compIdx];
    let poses;
    if (comp.authored) {
      poses = comp.poses;
    } else {
      const gen = computeGenerated(1440, 900, comp);
      poses = gen.map(d => ({svgIdx:d.svgIdx, x:d.pose.x, y:d.pose.y, w:d.pose.w, angle:d.pose.angle}));
    }
    let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
    for (const p of poses) {
      const info = cachedInfos[p.svgIdx];
      const hw = info.normW * p.w / 2;
      const hh = info.normH * p.w / 2;
      const a  = p.angle || 0;
      const ac = Math.abs(Math.cos(a)), as_ = Math.abs(Math.sin(a));
      const rw = hw*ac + hh*as_, rh = hw*as_ + hh*ac;
      minX=Math.min(minX,p.x-rw); maxX=Math.max(maxX,p.x+rw);
      minY=Math.min(minY,p.y-rh); maxY=Math.max(maxY,p.y+rh);
    }
    return { minX,maxX,minY,maxY,
      cx:(minX+maxX)/2, cy:(minY+maxY)/2,
      w:maxX-minX, h:maxY-minY };
  }

  /* ── Scoring ─────────────────────────────────────────────────────────── */
  function scoreComp(compIdx, vpW, vpH) {
    const b = compBBox(compIdx);
    const s = Math.min(vpW*0.96/b.w, vpH*0.96/b.h);
    return (s*b.w/vpW) * (s*b.h/vpH);
  }

  function pickComp(vpW, vpH) {
    let best=0, bestScore=-1;
    for (let i=0; i<COMPS.length; i++) {
      const score = scoreComp(i, vpW, vpH);
      if (score > bestScore) { bestScore=score; best=i; }
    }
    return best;
  }

  /* ── Fit authored composition uniformly ─────────────────────────────── */
  function fitAuthored(compIdx, vpW, vpH) {
    const comp = COMPS[compIdx];
    const bbox = compBBox(compIdx);
    const s  = Math.min(vpW*0.96/bbox.w, vpH*0.96/bbox.h);
    const tx = vpW/2 - bbox.cx*s;
    const ty = vpH/2 - bbox.cy*s;
    const wFill = Math.round(s*bbox.w/vpW*100);
    const hFill = Math.round(s*bbox.h/vpH*100);
    console.log(`[cc_v13] fitAuthored "${comp.name}" at ${vpW}×${vpH}: fill ${wFill}%W × ${hFill}%H (scale ${s.toFixed(4)})`);
    return comp.poses.map(p => ({
      char: p.char, svgIdx: p.svgIdx,
      pose: { x:p.x*s+tx, y:p.y*s+ty, w:p.w*s, h:p.w*s, angle:p.angle },
    }));
  }

  /* ── Generated composition: uniform-scale auto-fill ─────────────────── */
  function computeGenerated(W, H, comp) {
    const K      = comp.rows.length;
    const padTop = H*0.06;
    const bandH  = (H*0.88)/K;
    const maxW   = W*0.94;
    const allIdx = comp.rows.flat();
    let scale = bandH / Math.max(...allIdx.map(li=>cachedInfos[li].normH));
    for (const row of comp.rows) {
      const rowNW = row.reduce((s,li)=>s+cachedInfos[li].normW,0);
      if (rowNW*scale > maxW) scale=maxW/rowNW;
    }
    const out=[];
    comp.rows.forEach((row,ri) => {
      const cy = padTop+bandH*ri+bandH*0.5;
      const widths = row.map(li=>cachedInfos[li].normW*scale);
      const totalW = widths.reduce((s,w)=>s+w,0);
      let x=(W-totalW)/2;
      row.forEach((li,i) => {
        out.push({char:ALL_CHARS[li], svgIdx:li,
          pose:{x:x+widths[i]/2, y:cy, w:scale, h:scale, angle:0}});
        x+=widths[i];
      });
    });
    return out;
  }

  /* ── Resolve composition defs ────────────────────────────────────────── */
  function getDefs(compIdx) {
    const comp = COMPS[compIdx];
    const fh = height - ArtisType.World.floorInset;
    return comp.authored
      ? fitAuthored(compIdx, width, fh)
      : computeGenerated(width, fh, comp);
  }

  /* ── Build world ─────────────────────────────────────────────────────── */
  function build(compIdx) {
    if (!cachedInfos) return;
    cancelAnimationFrame(raf); raf=0; prevTime=0; accum=0; intro.cancelHome();
    ready=false; rendered.clear(); renderDirty=true;
    quietFrames=0; _restoredThisCycle=false;

    const defs   = getDefs(compIdx);
    const glyphs = defs.map(({char,svgIdx,pose},i) => {
      const g = new ArtisType.Glyph({char}, pose, i, cachedInfos[svgIdx].strokes);
      g.z=i; g.svgIdx=svgIdx; return g;
    });
    world = new ArtisType.World(width, height, glyphs);
    fitBBox = compBBox(compIdx);
    refFitS = Math.min(width*0.96/fitBBox.w, height*0.96/fitBBox.h);
    world.reducedMotion = reduced.matches;
    ready=true; renderDirty=true;
    if (intro.active) intro.attach();
    draw(); wake();
  }

  /* ── Sleep-snap Mode B ───────────────────────────────────────────────── */
  // Restores rest shape around each letter's current centroid — not original position.
  function popDeformedGlyphs() {
    if (!world) return;
    for (const g of world.glyphs) {
      if (g===world.drag?.glyph) continue;
      const mx=g.nodes.reduce((s,n)=>s+n.ox,0)/g.nodes.length;
      const my=g.nodes.reduce((s,n)=>s+n.oy,0)/g.nodes.length;
      for (const n of g.nodes) {
        n.x=g.cx+(n.ox-mx); n.y=g.cy+(n.oy-my);
        n.vx=0; n.vy=0;
      }
      g.update();
    }
    renderDirty=true;
  }

  /* ── Diagnostics HUD ────────────────────────────────────────────────── */
  function drawHUD(){
    if(!world)return;
    const last=meas._frames.length?meas._frames.at(-1):null;
    ctx.save();
    ctx.font='11px monospace';
    ctx.fillStyle='rgba(0,0,0,0.65)';
    ctx.fillText(
      `FPS:${_mFps}  phys:${last?last.physics_ms:0}ms  rend:${last?last.render_ms:0}ms  total:${last?last.total_ms:0}ms`,
      10,18
    );
    ctx.fillText(
      `raf: interval:${_mSmooth.interval.toFixed(1)}ms  lag:${_mSmooth.lag.toFixed(1)}ms`,
      10,32
    );
    ctx.fillText(
      `coll:${last?last.coll_ms:0}ms  pairs:${last?last.coll_pairs:0}  hits:${last?last.coll_hits:0}  particles:${world.nodes.length}`,
      10,46
    );
    ctx.fillText(
      `energy:${world.energy.toFixed(4)}  quiet:${quietFrames}/40  redist:${world.redistActive?'YES':'no'}  scale:${world.fitBase.scale.toFixed(3)}→${world.fitGoal.toFixed(3)}`,
      10,60
    );
    ctx.fillText(
      `steps/f:${last?last.steps_per_frame:0}  sim:${(_simTime/1000).toFixed(1)}s  drag:${world.drag?'YES':'no'}  rec:${replay.recording?'REC':'no'}  rep:${replay.replaying?'PLAY':'no'}  anim:${_mbAnim?((performance.now()-_mbAnim.startMs)/MB_ANIM_MS*100).toFixed(0)+'%':'--'}  [M]hide [C]csv`,
      10,74

  }

  /* ── Physics loop (cc_v4-timing accumulator) ─────────────────────────── */
  function frame(time) {
    raf=0;
    _loopFrame++;
    replay.tick();
    const cbStart=performance.now();
    _mRawLag=cbStart-time;
    _mRawInterval=_mPrevTs>0?time-_mPrevTs:0;
    _mPrevTs=time;
    const EMA=0.1;
    if(_mRawInterval>0)_mSmooth.interval+=EMA*(_mRawInterval-_mSmooth.interval);
    _mSmooth.lag+=EMA*(_mRawLag-_mSmooth.lag);
    _mFpsFrames++;
    if(time-_mFpsLast>=1000){_mFps=_mFpsFrames;_mFpsFrames=0;_mFpsLast=time;}
    if (document.hidden||!world||!ready) { prevTime=0; return; }
    if(prevTime===0){_simTime=0;_realStartTime=time;}
    const rawDelta=prevTime>0 ? time-prevTime : FIXED_DT;
    if(!_animOnly)accum+=Math.min(rawDelta,MAX_DELTA);
    prevTime=time;
    world._measOn=_measOn;
    world._meas.collMs=world._meas.collPairs=world._meas.collHits=0;
    const physStart=performance.now();
    let steps=0;
    if(!_animOnly){while (accum>=FIXED_DT && steps<MAX_STEPS) { intro.homeStep(); stage.step(); guard.step(); world.step(); renderDirty=true; accum-=FIXED_DT; steps++; _simTime+=FIXED_DT; }}
    const physMs=performance.now()-physStart;
    const realElapsed=time-_realStartTime;
    const rendStart=performance.now();
    tickModeBAnim();
    draw();
    const rendMs=performance.now()-rendStart;
    const totalMs=performance.now()-cbStart;
    // Update quiet state before recording so CSV reflects this frame's final values
    const quiet=!world.drag&&!world.busy&&world.energy<.08;
    quietFrames=quiet?quietFrames+1:0;
    let _modeB=0;
    if (!_restoredThisCycle&&quietFrames===38) {
      // Capture deformed state before physics snap
      const glyphData=world.glyphs.filter(g=>g!==world.drag?.glyph).map(g=>({
        g, cx:g.cx, cy:g.cy, fromNodes:g.nodes.map(n=>({x:n.x,y:n.y})),
      }));
      popDeformedGlyphs();
      _restoredThisCycle=true; _modeB=1;
      // Capture restored state and compute rotation delta
      for(const d of glyphData){
        d.toNodes=d.g.nodes.map(n=>({x:n.x,y:n.y}));
        let cross=0,dot=0;
        for(let i=0;i<d.g.nodes.length;i++){
          const fx=d.fromNodes[i].x-d.cx,fy=d.fromNodes[i].y-d.cy;
          const tx=d.toNodes[i].x-d.cx,ty=d.toNodes[i].y-d.cy;
          const mag=Math.hypot(fx,fy)*Math.hypot(tx,ty)||.001;
          cross+=(fx*ty-fy*tx)/mag; dot+=(fx*tx+fy*ty)/mag;
        }
        d.deltaAngle=Math.atan2(cross,dot);
      }
      _mbAnim={startMs:performance.now(),glyphs:glyphData};
    }
    if(_measOn){
      const glf={};
      world.glyphs.forEach((g,i)=>{
        let vmax=0;for(const n of g.nodes){const s=n.vx*n.vx+n.vy*n.vy;if(s>vmax)vmax=s;}
        glf[`L${i}_cx`]=+g.cx.toFixed(1);glf[`L${i}_cy`]=+g.cy.toFixed(1);
        glf[`L${i}_vmax`]=+Math.sqrt(vmax).toFixed(3);
        glf[`L${i}_rdx`]=+(g._rdx||0).toFixed(3);glf[`L${i}_rdy`]=+(g._rdy||0).toFixed(3);
      });
      meas.push({
        frame:meas._fn++,timestamp_ms:+time.toFixed(0),fps:_mFps,
        physics_ms:+physMs.toFixed(2),render_ms:+rendMs.toFixed(2),total_ms:+totalMs.toFixed(2),
        raf_interval_ms:+_mRawInterval.toFixed(2),raf_lag_ms:+_mRawLag.toFixed(2),
        coll_ms:+(world._meas.collMs).toFixed(2),
        coll_particles:world.nodes.length,
        coll_pairs:world._meas.collPairs,coll_hits:world._meas.collHits,
        steps_per_frame:steps,sim_time_ms:+_simTime.toFixed(0),real_time_ms:+realElapsed.toFixed(0),
        dragging:world.drag?1:0,energy:+world.energy.toFixed(4),
        quiet_frames:quietFrames,sleep:quietFrames>=40?1:0,mode_b:_modeB,
        redist_active:world.redistActive?1:0,
        fit_scale:+world.fitBase.scale.toFixed(4),fit_goal:+world.fitGoal.toFixed(4),
        vp_w:width,vp_h:height,
        ...glf,
      });
    }
    // Physics sleeps at frame 40 unconditionally
    if (quietFrames>=40&&!_animOnly) {
      world.sleep(); prevTime=0; accum=0; _animOnly=true;
      if(_autoDownload){_autoDownload=false;meas.download();}
    }
    // RAF continues only while physics active or visual animation running
    if (quietFrames<40||_mbAnim) raf=requestAnimationFrame(frame);
  }

  function wake() {
    if (intro.active) return; // world is held until the bubble intro hands off
    cancelModeBAnim();
    if(_animOnly) accum=0;
    _animOnly=false;
    quietFrames=0; _restoredThisCycle=false;
    if (!raf&&!document.hidden) { prevTime=0; raf=requestAnimationFrame(frame); }
  }

  /* ── Rendering ───────────────────────────────────────────────────────── */
  function prepareLetter(glyph) {
    const rx=glyph.nodes[0].rx/glyph.radius, ry=glyph.nodes[0].ry/glyph.radius;
    const paths=glyph.paths.map(stroke=>{
      const nodes=stroke.nodes, count=nodes.length, path=new Path2D();
      const ax=n=>n._animX??n.x, ay=n=>n._animY??n.y;
      const at=n=>[ax(n)/rx,ay(n)/ry], mid=(a,b)=>[(ax(a)+ax(b))/2/rx,(ay(a)+ay(b))/2/ry];
      let last=null;
      const to=(x,y)=>{if(!last)path.moveTo(x,y);else if(Math.hypot(x-last[0],y-last[1])<.05)return;else path.lineTo(x,y);last=[x,y]};
      const curve=(p0,c,p1)=>{
        const ax=c[0]-p0[0],ay=c[1]-p0[1],bx=p1[0]-c[0],by=p1[1]-c[1];
        const pieces=clamp(Math.ceil(Math.abs(Math.atan2(ax*by-ay*bx,ax*bx+ay*by))/.1),1,24);
        for(let k=1;k<=pieces;k++){const t=k/pieces,u=1-t;to(u*u*p0[0]+2*u*t*c[0]+t*t*p1[0],u*u*p0[1]+2*u*t*c[1]+t*t*p1[1])}
      };
      if(stroke.closed){
        let start=mid(nodes.at(-1),nodes[0]);to(...start);
        for(let i=0;i<count;i++){const end=mid(nodes[i],nodes[(i+1)%count]);curve(start,at(nodes[i]),end);start=end}
        path.closePath();
      } else {
        let start=at(nodes[0]);to(...start);
        for(let i=1;i<count-1;i++){const end=mid(nodes[i],nodes[i+1]);curve(start,at(nodes[i]),end);start=end}
        if(count>1)to(...at(nodes.at(-1)));
        if(count===1)path.lineTo(...start);
      }
      return path;
    });
    return {paths,rx,ry};
  }

  function drawSolid(glyph, drawing) {
    const halo=Math.max(1.5,Math.min(4.5,Math.min(width,height)*.0035));
    ctx.save(); ctx.scale(drawing.rx,drawing.ry); ctx.lineCap='round'; ctx.lineJoin='round';
    const band=halo*2/Math.sqrt(drawing.rx*drawing.ry);
    ctx.strokeStyle='rgba(255,255,255,0.97)'; ctx.lineWidth=glyph.radius*2+band;
    for(const p of drawing.paths)ctx.stroke(p);
    ctx.strokeStyle=ink[glyph.svgIdx]??COLOR; ctx.lineWidth=glyph.radius*2;
    for(const p of drawing.paths)ctx.stroke(p);
    ctx.restore();
  }

  function draw() {
    if (!world||!ready||intro.active) return;
    ctx.setTransform(ratio,0,0,ratio,0,0);
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,width,height);
    const sorted=[...world.glyphs].sort((a,b)=>(a.z||0)-(b.z||0));
    for (const g of sorted) {
      if (renderDirty||g._pathDirty||!rendered.has(g.index)) {
        rendered.set(g.index, prepareLetter(g));
        g._pathDirty=false;
      }
      drawSolid(g, rendered.get(g.index));
    }
    stage.drawOver(ctx);
    if(_measOn)drawHUD();
    renderDirty=false;
  }

  /* ── Projects masthead (projectorgv5) ─────────────────────────────────── */
  // Opening Projects lifts the list from the bottom, and the list's top edge rides the letters'
  // floor: it's the list that shoves them up into the band above, where they steer into the
  // site's one-row layout for that sliver. Steering is projectorgv1's: it pushes on velocity,
  // so letters keep real momentum, overshoot, bump and squish. Closing always flies to a fresh
  // homepage layout for the current window, never back to where they were before.
  // Nothing passes through anything, except as the burst's last resort (below). Letters that must swap places squeeze (projectorgv3's
  // pick): a letter blocked for ~0.5 s by one ahead of it shrinks, slips through the gap, and
  // springs back to size once it's past. Opening and closing go by makeway's lanes, so most
  // never meet: opening, the lower rows first slide sideways under the top row, then rise into
  // the space it has cleared; closing, the lower rows first drop out of the band, then slide
  // into place, while the top row waits a beat before spreading out. Bursting out of the intro
  // bubble is all at once (a jumbled cluster has no rows to take turns), so squeezing is what
  // untangles it: everyone flies at BSQ. A burst letter still stuck after that gets
  // projectorgv3's last resort: it slips past whatever it's touching until it's home.
  const stage = (() => {
    const SQ=.55, STUCK=30, COOL=30; // squeeze scale; steps without getting closer before squeezing; steps before squeezing again
    const BSQ=.75, LAST=90; // the burst's squeeze: gentler, since the last resort catches what it can't fit; steps stuck (1.5 s) before the last resort
    let open=false, fly=[], engaged=false;
    let footer=0, floor=null, floorGoal=null, band=0, popRing=null;
    // projectorgv7: inside a case study the band is compact, closer to malaikafrancique.com's slim
    // masthead; the list gets the full band. Only the band's height changes: the letters fly to the
    // smaller (or larger) formation the way they fly into the band. reband: waiting for a burst to land
    let compact=false, reband=false;
    const COMPACT=.55, COMPACT_TALL=.75; // share of the full band (an upright phone's row is already small)
    const projEl=document.getElementById('projects'), listEl=projEl.querySelector('.sheet');
    const WAIT=24; // closing: steps the top row waits for the lower rows to drop (0.4 s)

    // The site's own layout for a w×h space: the same pick the homepage makes for the window
    function defsFor(w,h){
      const i=pickComp(w,h);
      return COMPS[i].authored?fitAuthored(i,w,h):computeGenerated(w,h,COMPS[i]);
    }
    // The homepage formation for the current window
    function homeLayout(){
      const by=new Map(defsFor(width,height-footer).map(d=>[d.svgIdx,d.pose]));
      Object.assign(world.fitBase,{w:width,h:height,scale:1,v:0});world.target=null; // later resizes scale from here
      return world.glyphs.map(g=>{const p=by.get(g.svgIdx);return p?{g,x:p.x,y:p.y,w:p.w}:{g}});
    }
    // Never wait on the intro: pop its bubble (or stop its post-pop homing) and take the letters now.
    // Returns true when it popped the bubble: the letters burst out of a jumbled cluster.
    function takeOver(){
      const h=intro.active?intro.popNow():intro.releaseHome();
      if(h?.ring)popRing={...h.ring,a:1};
      return !!h?.ring;
    }
    // Row index (top row 0) for each y: a new row starts more than ~half a letter below the last
    function rowsOf(ys,hs){
      const gap=[...hs].sort((a,b)=>a-b)[hs.length>>1]*.6;
      const order=ys.map((y,i)=>i).sort((a,b)=>ys[a]-ys[b]),rows=[];let r=0;
      order.forEach((i,k)=>{if(k&&ys[i]-ys[order[k-1]]>gap)r++;rows[i]=r});
      return rows;
    }

    // Targets: {g, x, y, w}. Omit x/y to only rescale; w is the goal glyph width.
    // lanes: opening, rows below the top slide sideways first ('x' leg), then rise;
    // closing, letters bound for the lower rows drop first ('y' leg) and the top row waits.
    // No lanes (the burst): everyone at once, squeezed from the start (see stepFly).
    // burst: squeezed to BSQ, with the last resort for a letter that still can't get home.
    function flyTo(list,{lanes=null,squeezed=false,burst=false}={}){
      const rows=lanes?rowsOf(lanes.ys,lanes.hs):null;
      fly=list.map((t,i)=>{
        const prev=fly.find(f=>f.g===t.g),steer=t.x!=null,lower=rows&&rows[i]>0;
        return {g:t.g,tx:t.x,ty:t.y,steer,s:1,sv:prev?prev.sv:0,goal:t.w?t.w/t.g.w:1,
          steps:0,fade:0,sq:(squeezed||burst)&&steer?1:0,burst:burst&&steer,slip:false,cool:0,fin:t.w?t.w/t.g.w:1,best:Infinity,since:0,
          leg:lower?(lanes.closing?'y':'x'):null,wait:rows&&lanes.closing&&!lower?WAIT:0};
      });
      for(const f of fly)if(f.sq){f.sqb=null;f.goal=f.fin*(f.burst?BSQ:SQ)}
    }
    function toBand(burst){
      // an upright phone always gets the one-row layout, and the band is only as tall as that
      // row needs plus some air; otherwise the site's own pick for a sliver
      const tall=width<height,b=compBBox(0);
      band=Math.round(tall?clamp(b.h*width*.96/b.w*1.3,80,height*.3):clamp(height*.16,100,200));
      if(compact)band=Math.round(band*(tall?COMPACT_TALL:COMPACT));
      floorGoal=height-band;
      projEl.style.setProperty('--sheet-top',band+'px');
      const cx=width/2,cy=band/2,by=new Map((tall?fitAuthored(0,width,band):defsFor(width,band)).map(d=>[d.svgIdx,d.pose]));
      const list=world.glyphs.map(g=>{const p=by.get(g.svgIdx);
        return p?{g,x:cx+(p.x-cx)*.9,y:cy+(p.y-cy)*.9,w:p.w*.9}:{g}});
      // the burst is all at once, as projectorgv1's pop; otherwise rows leave top first
      flyTo(list,burst?{burst:true}:{lanes:{ys:world.glyphs.map(g=>g.cy),hs:world.glyphs.map(g=>g.h)}});
    }

    const touching=(a,b)=>{const p=a.bounds,q=b.bounds;return p.minX<q.maxX&&p.maxX>q.minX&&p.minY<q.maxY&&p.maxY>q.minY};
    // The letter touching f's glyph that's furthest along its way to its spot, if any
    function blockerOf(f){
      const g=f.g,ux=f.tx-g.cx,uy=f.ty-g.cy;let best=null,bd=0;
      for(const o of world.glyphs){if(o===g||!touching(g,o))continue;
        const d=(o.cx-g.cx)*ux+(o.cy-g.cy)*uy;if(d>bd){bd=d;best=o}}
      return best;
    }
    function unsqueeze(f){if(f.sq){f.sq=0;f.goal=f.fin;f.cool=COOL;f.since=0;f.best=Infinity}}
    // Collision exemptions for the last resort (projectorgv3's): a slipping letter passes whatever
    // it's touching; a pair already slipping keeps slipping until clear, so contact doesn't snap
    // back mid-overlap. With nobody slipping, every pair collides.
    function updatePasses(){
      const prev=new Map(world.glyphs.map(g=>[g,g._passes]));
      for(const g of world.glyphs)g._passes=null;
      // at rest every pair collides (projectorgv3's rule): a pair left overlapping pushes apart
      // instead of staying ghosted together, and nothing carries over into the next flight
      if(!fly.some(f=>f.steer))return;
      const link=(a,b)=>{(a._passes??=new Set()).add(b);(b._passes??=new Set()).add(a)};
      for(const f of fly)if(f.slip)for(const g of world.glyphs)if(g!==f.g&&touching(f.g,g))link(f.g,g);
      for(const [a,set] of prev)if(set)for(const b of set)if(touching(a,b))link(a,b);
    }
    function stepFly(){
      let active=0;
      for(const f of fly){
        const g=f.g;let live=false;
        if(f.steer&&world.drag?.glyph===g){f.steer=false;f.slip=false;unsqueeze(f)}
        // closing: holding until the row ahead clears. Shrinking goes ahead (it makes room);
        // growing waits, so a held letter doesn't swell into the row that's leaving
        const held=f.steer&&f.wait>0;
        if(held){f.wait--;live=true}
        if(f.goal!==null&&!(held&&f.goal>1)){ // sway-b scale spring: swells past the goal, then jiggles back
          f.sv+=(f.goal-f.s)*.05-f.sv*.18;let next=Math.max(.05,f.s+f.sv);
          if(Math.abs(f.goal-next)<.001&&Math.abs(f.sv)<.0005){next=f.goal;f.goal=null}
          world.scaleGlyph(g,next/f.s);f.s=next;live=true;
        }
        if(f.steer&&!held){ // projectorgv1 steering: light brake, so letters overshoot and sway in
          f.steps++;
          let vx=0,vy=0;for(const n of g.nodes){vx+=n.vx;vy+=n.vy}vx/=g.nodes.length;vy/=g.nodes.length;
          // lane: steer one axis only until that leg is done (the other is left to physics)
          if(f.leg==='x'&&(Math.abs(f.tx-g.cx)<g.w*.15||f.steps>150))f.leg=null;
          if(f.leg==='y'&&(Math.abs(f.ty-g.cy)<g.h*.25||f.steps>150))f.leg=null;
          const sp=Math.hypot(vx,vy),dist=Math.hypot(f.tx-g.cx,f.ty-g.cy);
          // squeeze: blocked short of its spot by a letter ahead of it. A pinned letter still
          // jiggles as it pushes, so 'blocked' is no progress toward its spot, not no motion
          if(f.cool>0)f.cool--;
          if(dist<f.best-2){f.best=dist;f.since=0}else f.since++;
          if(!f.fade&&f.since>(f.burst?LAST:STUCK)&&dist>g.radius*2&&(f.burst?!f.slip:!f.sq&&!f.cool)){
            if(f.burst)f.slip=true; // squeezing wasn't enough: last resort
            else{const b=blockerOf(f);if(b){f.sq=1;f.sqb=b;f.goal=f.fin*SQ;f.leg=null}}
            f.since=0;f.best=Infinity;
          }
          if(f.slip&&dist<4)f.slip=false;
          // back to size once the letter it squeezed past is no longer ahead of it (or it's home).
          // Out of the burst there's no one letter to get past (projectorgv1 let crossing paths
          // pass through): it flies small the whole way and swells back once it's nearly home
          if(f.sq&&f.sqb){const b=f.sqb,ahead=touching(g,b)&&(b.cx-g.cx)*(f.tx-g.cx)+(b.cy-g.cy)*(f.ty-g.cy)>0;
            if(!ahead||dist<g.radius*2||++f.sq>240)unsqueeze(f)}
          else if(f.sq&&(dist<g.w/f.s*f.fin*.5||++f.sq>300))unsqueeze(f);
          const dx=f.leg==='y'?0:f.tx-g.cx,dy=f.leg==='x'?0:f.ty-g.cy;
          // let go on arrival, once it's nearly there and has gone still for 0.5 s (a neighbour can
          // pin it a few px short; holding it till the 6 s give-up made the row 'sigh' on release),
          // or after 6 s of trying
          f.calm=sp<.3?(f.calm||0)+1:0;
          const arrived=(dist<4&&sp<.5)||(f.calm>30&&dist<g.w*.3);
          if(!f.fade&&(arrived||f.steps>360))f.fade=f.steps;
          const w=Math.min(1,f.steps/8)*(f.fade?1-Math.min(1,(f.steps-f.fade)/18):1);
          if(w<=0){f.steer=false;f.slip=false;unsqueeze(f)}
          else{
            let ax=(dx*.012-vx*.05)*w,ay=(dy*.012-vy*.05)*w;const am=Math.hypot(ax,ay);if(am>2.5){ax*=2.5/am;ay*=2.5/am}
            for(const n of g.nodes){n.vx+=ax;n.vy+=ay}
            live=true;
          }
        }
        if(live)active++;
      }
      fly=fly.filter(f=>f.steer||f.goal!==null);
      return active;
    }

    // The list's top edge rides the floor and never rises above it, so the list shoves the
    // letters up and never covers them. f: how far the floor has risen from the footer to the band.
    function placeList(){
      if(floorGoal==null&&floor===footer){listEl.style.transform='';return}
      const top=height-band,f=top>footer?clamp((floor-footer)/(top-footer),0,1):1;
      listEl.style.transform=`translateY(${(1-f)*(height-band)}px)`;
    }
    function step(){
      // the floor glides with the list (capped, so letters get shoved, not teleported)
      const fg=floorGoal??footer;
      if(floor===null)floor=fg;else floor+=clamp((fg-floor)*.1,-18,18);
      if(Math.abs(fg-floor)<.5)floor=fg;
      ArtisType.World.floorInset=floor;
      placeList();
      if(popRing){popRing.r+=10;popRing.a-=.08;if(popRing.a<=0)popRing=null}
      if(reband&&!fly.some(f=>f.burst&&f.steer)){reband=false;if(open)toBand(false)}
      const active=stepFly();
      updatePasses();
      // world.busy honours `returning`: keep the loop awake while the stage is moving
      if(active||popRing||floor!==fg){world.returning=active+1;engaged=true}
      else if(engaged){world.returning=0;engaged=false}
    }

    function rim(c,x,y,r,alpha){
      if(r<1||alpha<=0)return;
      c.save();c.globalAlpha=Math.min(1,alpha);

  /* ── Word guard ───────────────────────────────────────────────────────── */
  // Dragging letters around must never spell PENIS, RAPE or RAPIST. A word counts when its
  // letters read left to right in one row with nothing between them, however far apart
  // (R      A P E does); stacked letters don't, so the site's own layouts never trip it.
  // Once one is spelled, all its letters shuffle: each flies to another one's spot.
  const guard = (() => {
    const WORDS=['PENIS','RAPE','RAPIST'];
    const ht=g=>g.bounds.maxY-g.bounds.minY;
    const row=(a,b)=>Math.abs(a.cy-b.cy)<Math.min(ht(a),ht(b))*.55;
    // b reads straight after a: same row, to its right, and no letter in between
    function next(a,b){
      if(!(b.cx>a.cx&&row(a,b)))return false;
      return !world.glyphs.some(c=>c!==a&&c!==b&&c.cx>a.cx&&c.cx<b.cx&&row(a,c)&&row(b,c));
    }
    const of=c=>world.glyphs.filter(g=>g.char===c);

    function chains(w){

      return out;

    /* (Re)attach to a freshly built world — first load or resize during intro */

      C={x:width/2,y:height/2}; R0=Math.min(width,height)*.4; setRadius(); lastW=width; lastH=height;
      let fx0=Infinity,fx1=-Infinity,fy0=Infinity,fy1=-Infinity;
      for(const g of world.glyphs){fx0=Math.min(fx0,g.cx);fx1=Math.max(fx1,g.cx);fy0=Math.min(fy0,g.cy);fy1=Math.max(fy1,g.cy)}

    const useW2=()=>glass.ok&&glass.oil();
    function buildW2(){
      const gs=L.map(l=>{const g=l.g;
        const g2=new ArtisType.Glyph({char:g.char},{x:l.x,y:l.y,w:g.w*l.s,h:g.h*l.s,angle:g.angle+l.a},g.index,cachedInfos[g.index].strokes);

    function popNow(){

    /* Burst phase: per-letter springs to formation pose (underdamped → overshoot) */

  new ResizeObserver(resize).observe(canvas);

    .then(infos => {

})();

/* ── Info modal + Projects: list and case studies (projectorgv6) ─────────
   The address is the source of truth: (no hash) home, #/projects the list, #/projects/<slug> a
   case study. Every in-page move is a history entry, so back/forward and the phone's back gesture
   just work; each entry keeps its own scroll position. Only home <-> list/project moves the letters
   (stage.open/close, as v5's toggle did); list <-> project only swaps what the sheet shows. */
(() => {
  const about    = document.getElementById('about');

  const projects = document.getElementById('projects');
  const projBtn  = document.getElementById('projects-btn');
  const sheet    = projects.querySelector('.sheet');
  const listView = document.getElementById('list-view'), grid = listView.querySelector('.project-grid');
  const projView = document.getElementById('project-view');
  const zoom     = document.getElementById('zoom');
  const stage    = window.ProjectStage;

  let infoOpen = false, sheetOpen = false, view = { name: 'home' }, data = null, media = {}, waitOpen = 0;

  /* routes */

  const hrefOf = v => v.name === 'home' ? HOME_URL : v.name === 'list' ? '#/projects' : v.name === 'about' ? '#/about' : '#/projects/' + v.slug;
  function parse(hash) {

    const m = /^#\/projects(?:\/([\w-]+))?\/?$/.exec(hash);

  function pauseAll() { sheet.querySelectorAll('video').forEach(v => v.pause()); }
  function playVisible() { // the observer only reports changes, so kick what's already in view
    for (const v of sheet.querySelectorAll('#' + (view.name === 'list' ? 'list-view' : 'project-view') + ' video')) {
      const r = v.getBoundingClientRect(); if (r.bottom > 0 && r.top < innerHeight) play(v);
    }
  }

  /* views */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  function renderList() {
    grid.innerHTML = '';
    for (const p of data.projects) {
      const a = document.createElement('a');
      a.className = 'project'; a.href = hrefOf({ name: 'project', slug: p.slug });
      const thumb = document.createElement('div'); thumb.className = 'thumb';
      if (/\.mp4$/.test(p.card.src)) {
        const v = document.createElement('video');
        Object.assign(v, { muted: true, loop: true, playsInline: true, preload: 'metadata', poster: p.card.poster });
        v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.dataset.src = p.card.src;
        thumb.append(v); watch.observe(v);
      } else {
        const img = document.createElement('img'); img.src = p.card.src; img.alt = p.card.alt || ''; img.loading = 'lazy';
        thumb.append(img);
      }
      a.append(thumb);
      a.insertAdjacentHTML('beforeend', `<p>${esc(p.title)}</p><p class="meta">${esc(p.type)}</p>`);
      grid.append(a);
    }
  }
  function textEl(tag, cls, s) { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = s; return e; }
  // The self-portrait draws itself, stroke by stroke (a centreline trace, longest strokes taking
  // longest), once it's on screen; then the exact outline of the original drawing takes over
  function drawPortrait(box) {
    fetch('about/portrait.svg', { cache: 'no-cache' }).then(r => r.text()).then(svg => {
      box.innerHTML = svg + '<div class="btw" aria-hidden="true"><svg viewBox="0 0 46 22"><path d="M44 13 C33 15 20 15 4 10 M10 4 L3 10 L11 15"/></svg><span>me btw<svg class="to-photo" viewBox="0 0 60 18"><path d="M9 1 C7 10 15 15 29 14 C40 13 48 12 55 10 M49 6 L56 10 L50 15"/></svg></span></div>';
      if (!document.getElementById('gaegu')) document.head.insertAdjacentHTML('beforeend', // the note's marker font, only for this page
        '<link id="gaegu" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu&display=swap">');
      const strokes = [...box.querySelectorAll('.strokes path')], done = () => box.classList.add('done');
      if (matchMedia('(prefers-reduced-motion: reduce)').matches || !box.animate) return done();
      const L = strokes.map(p => p.getTotalLength()), total = L.reduce((a, b) => a + b, 0), TIME = 2600;
      strokes.forEach((p, i) => { p.style.strokeDasharray = L[i]; p.style.strokeDashoffset = L[i]; });
      const obs = new IntersectionObserver(([e]) => {
        if (!e.isIntersecting) return; obs.disconnect();
        let t = 0;
        strokes.forEach((p, i) => {
          const d = Math.max(40, L[i] / total * TIME);
          p.animate([{ strokeDashoffset: L[i] }, { strokeDashoffset: 0 }], { duration: d, delay: t, fill: 'forwards', easing: 'ease-in-out' });
          t += d * .85;
        });
        setTimeout(done, t + 200);
      }, { threshold: .3 });
      obs.observe(box);
    }).catch(() => {});
  }
  // The hidden About page: the case-study layout, then every project in its own colour
  function renderAbout() {
    projView.innerHTML = '';
    const c = document.createElement('article'); c.className = 'case about';
    const head = document.createElement('div'); head.className = 'case-head';
    const h1 = document.createElement('h1'), side = document.createElement('div');
    h1.append(textEl('span', 'title', 'About'), textEl('span', 'type', 'VCD / UX / UI'));
    const portrait = document.createElement('div'); portrait.className = 'portrait';
    side.append(h1); drawPortrait(portrait);
    const text = document.createElement('div'); text.className = 'case-text';
    for (const t of ["I am a visual communication designer and photographer with roots to California, Panama and Washington.",
                     "I see life through a lens obsessed with patterns, textures and storytelling.",
                     "Seeing how colour can communicate rhythm and identity itches a spot in my brain, i.e., where design meets sport, how a space, a mark or something as simple as a jersey can carry pride and emotion.",
                     "Brand identities, environmental graphics, digital experiences.",
                     "Outside of the computer, I competed as a Division I long jumper and two-time All-American at the University of Washington. I enjoy traveling without itineraries... and talking, I love to talk.",
                     "On the weekends, you'll find me running and jumping into sand pits :)"])
      text.append(textEl('p', '', t));
    const meta = document.createElement('div'); meta.className = 'case-meta';
    const mail = textEl('a', '', 'partisuw@gmail.com'); mail.href = 'mailto:partisuw@gmail.com';
    const ig = textEl('a', 'ig-link', '@iprestin'); Object.assign(ig, { href: 'https://www.instagram.com/iprestin/', target: '_blank', rel: 'noopener' });
    const cv = textEl('a', '', 'Resume (PDF)'); Object.assign(cv, { href: 'prestin-artis-resume.pdf', target: '_blank', rel: 'noopener' });
    for (const a of [mail, ig, cv]) { const d = document.createElement('div'); d.append(a); meta.append(d); }
    head.append(side, text, meta);
    // the photo from the old Cargo About page: under the bio, or on a phone beside the drawing, above it all
    const ph = document.createElement('figure'); ph.className = 'about-photo';
    const img = document.createElement('img'); img.className = 'm zoomable';
    img.srcset = [800, 1600, 2400].map(w => `about/prestin-scooter-${w}.jpg ${w}w`).join(', ');
    img.sizes = '(max-width: 543px) 100vw, 30vw'; img.src = 'about/prestin-scooter-1600.jpg'; img.dataset.zoom = 'about/prestin-scooter-2400.jpg';
    img.alt = 'Prestin, laughing in white sunglasses, balanced upside down on a stool holding a scooter overhead';
    img.width = 2400; img.height = 3600; img.loading = 'lazy'; ph.append(img);
    if (PHONE.matches) {
      const top = document.createElement('div'); top.className = 'about-top';
      img.sizes = '50vw'; top.append(portrait, ph); c.append(top, head);
    } else { img.sizes = '280px'; side.append(portrait); meta.append(ph); c.append(head); } // small, under the resume link
    const list = document.createElement('div'); list.className = 'about-work';
    for (const q of data.projects) {
      const a = document.createElement('a'); a.href = hrefOf({ name: 'project', slug: q.slug });
      const t = textEl('span', 'title', q.title); t.style.background = [].concat(q.color || '#E7006A')[0];
      a.append(t, textEl('span', 'type', q.type)); list.append(a);
    }
    c.append(list); projView.append(c);
  }
  function renderProject(p) {
    projView.innerHTML = '';
    const c = document.createElement('article'); c.className = 'case';
    const back = textEl('a', 'back', '← Projects'); back.href = hrefOf({ name: 'list' }); c.append(back);
    c.append(mediaEl(p.hero, { eager: true }));
    // the introduction, in malaikafrancique.com's format: title + disciplines (one per line) |
    // a short description (blank lines split paragraphs) | kind of project, client, year, then the
    // rest of the credits (unknowns stay blank) and links
    const head = document.createElement('header'); head.className = 'case-head';
    const h1 = document.createElement('h1'); h1.append(textEl('span', 'title', p.title));
    if (p.type) { const t = document.createElement('span'); t.className = 'type';
      p.type.split(/\s*\+\s*/).forEach((d, i) => { if (i) t.append(document.createElement('br')); t.append(d); }); h1.append(t); }
    head.append(h1);
    const text = document.createElement('div'); text.className = 'case-text';
    for (const para of (p.summary || '').split(/\n\s*\n/)) if (para.trim()) text.append(textEl('p', '', para.trim()));
    const meta = document.createElement('dl'); meta.className = 'case-meta';
    for (const [k, v] of [['Project', p.context], ['Client', p.client], ['Year', p.year], ['Team', (p.team || []).join(', ')], ['Role', p.role]]) {
      if (!v) continue;
      const d = document.createElement('div'); d.append(textEl('dt', '', k), textEl('dd', '', v)); meta.append(d);
    }
    for (const k of p.links || []) {
      const d = document.createElement('div'), a = textEl('a', '', k.label + ' \u2197\uFE0E'); // FE0E: a text arrow, not iOS's emoji box
      a.href = k.url; a.target = '_blank'; a.rel = 'noopener'; d.append(a); meta.append(d);
    }
    head.append(text, meta); c.append(head);
    const blocks = document.createElement('div'); blocks.className = 'blocks';
    for (const b of p.blocks) blocks.append(blockEl(b));
    c.append(blocks);
    // the longer writing comes after the work: the quote, then each section in its own column
    if (p.quote || p.sections?.length) {
      const notes = document.createElement('section'); notes.className = 'case-notes';
      if (p.quote) notes.append(textEl('blockquote', 'quote', p.quote));
      // a section marked "below" stacks under the previous one, in the same column
      for (const s of p.sections || []) {
        const prev = notes.lastElementChild, stack = s.below && prev?.tagName === 'DIV';
        const d = stack ? prev : document.createElement('div');
        const h3 = textEl('h3', '', s.heading); if (stack) h3.style.marginTop = '1.6em';
        d.append(h3, textEl('p', '', s.body)); if (!stack) notes.append(d);
      }
      c.append(notes);
    }
    const i = data.projects.indexOf(p), n = data.projects[(i + 1) % data.projects.length];
    const next = document.createElement('a'); next.className = 'next';
    if (i === data.projects.length - 1) { // after the last project: what Prestin is working on now
      Object.assign(next, { href: 'https://apps.apple.com/us/app/pelicula/id6763131679', target: '_blank', rel: 'noopener' });
      next.classList.add('next-app');
      const icon = Object.assign(document.createElement('img'), { src: 'soon/pelicula-icon.png', width: 48, height: 48, alt: '' });
      const t = document.createElement('div');
      t.append(textEl('span', '', 'Currently working on'), textEl('strong', '', 'Pelicula \u2197\uFE0E'), textEl('span', 'next-sub', 'An iPhone app to rank and track the films you\'ve seen'));
      next.append(icon, t);
    } else {
      next.href = hrefOf({ name: 'project', slug: n.slug });
      next.append(textEl('span', '', 'Next project'), textEl('strong', '', n.title));
    }
    c.append(next);
    projView.append(c);
    fadeIn(c);
  }
  // Each image below the first screen fades up the first time it scrolls into the sheet. What's
  // already showing when the project opens (after any scroll restore) appears as is, so nothing
  // flickers; reduced-motion settings turn it off.
  let fadeObs = null;
  function fadeIn(c) {
    fadeObs?.disconnect(); fadeObs = null;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const figs = [...c.querySelectorAll('.blocks figure')].filter(f => !f.closest('.b-ticker')); // a ticker is already moving
    figs.forEach(f => f.classList.add('fade-wait'));
    fadeObs = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.replace('fade-wait', 'fade-in'); fadeObs.unobserve(e.target);
    }), { root: sheet, rootMargin: '0px 0px -8% 0px' });
    requestAnimationFrame(() => { // after show() has restored the scroll position
      const view = sheet.getBoundingClientRect();
      for (const f of figs) {
        const r = f.getBoundingClientRect();
        if (r.top < view.bottom && r.bottom > view.top) f.classList.remove('fade-wait'); else fadeObs?.observe(f);
      }
    });
  }
  // The ticker's drift: while nobody is touching it (and a fling has coasted to a stop), the strip
  // scrolls on by DRIFT px a second. It sits in the middle of its three copies, jumping back one
  // copy's width when it drifts past, so it never runs out either way. Runs only while on screen
  function ticker(t, track) {
    const DRIFT = 35, still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let pos = 0, third = 0, raf = 0, prev = 0, touching = false, userAt = 0, seen = false;
    const setup = () => { third = track.scrollWidth / 3; if (third) { pos = third; t.scrollLeft = pos; } };
    const tick = now => {
      raf = 0; if (!t.isConnected) return;
      const dt = prev ? Math.min(.05, (now - prev) / 1000) : 0; prev = now;
      if (!third) setup();
      if (third && !touching && now - userAt > 600) { // idle: drift, and keep to the middle copy
        if (pos >= 2 * third) pos -= third; else if (pos < third) pos += third;
        if (!still) pos += DRIFT * dt;
        t.scrollLeft = pos;
      }
      if (seen) raf = requestAnimationFrame(tick);
    };
    t.addEventListener('scroll', () => { // a scroll we didn't make is the visitor's: hand over
      if (Math.abs(t.scrollLeft - pos) > 2) { pos = t.scrollLeft; userAt = performance.now(); }
    }, { passive: true });
    t.addEventListener('touchstart', () => { touching = true; }, { passive: true });
    for (const ev of ['touchend', 'touchcancel']) t.addEventListener(ev, () => { touching = false; userAt = performance.now(); }, { passive: true });
    t.addEventListener('wheel', () => { userAt = performance.now(); }, { passive: true });
    new IntersectionObserver(([e]) => { seen = e.isIntersecting; prev = 0; if (seen && !raf) raf = requestAnimationFrame(tick); }).observe(t);
  }
  // The panorama's glide: end to end at GLIDE px a second, resting a moment at each end, while
  // nobody is touching it; a visitor's own pan hands it over the same way as the ticker
  function pano(w) {
    const GLIDE = 30, REST = 1200, still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let pos = 0, dir = 1, raf = 0, prev = 0, touching = false, userAt = 0, restUntil = 0, seen = false;
    const tick = now => {
      raf = 0; if (!w.isConnected) return;
      const dt = prev ? Math.min(.05, (now - prev) / 1000) : 0; prev = now;
      const max = w.scrollWidth - w.clientWidth;
      if (!still && max > 0 && !touching && now - userAt > 600 && now > restUntil) {
        pos += dir * GLIDE * dt;
        if (pos >= max) { pos = max; dir = -1; restUntil = now + REST; }
        if (pos <= 0) { pos = 0; dir = 1; restUntil = now + REST; }
        w.scrollLeft = pos;
      }
      if (seen) raf = requestAnimationFrame(tick);
    };
    w.addEventListener('scroll', () => { if (Math.abs(w.scrollLeft - pos) > 2) { pos = w.scrollLeft; userAt = performance.now(); } }, { passive: true });
    w.addEventListener('touchstart', () => { touching = true; }, { passive: true });
    for (const ev of ['touchend', 'touchcancel']) w.addEventListener(ev, () => { touching = false; userAt = performance.now(); }, { passive: true });
    new IntersectionObserver(([e]) => { seen = e.isIntersecting; prev = 0; if (seen && !raf) raf = requestAnimationFrame(tick); }).observe(w);
  }
  const PHONE = matchMedia('(max-width: 543px)');
  PHONE.addEventListener('change', () => { // tickers and rows swap at the phone width
    const p = view.name === 'project' && data?.projects.find(q => q.slug === view.slug);
    if (view.name === 'about') { const y = sheet.scrollTop; renderAbout(); setScroll(y); return; }
    if (p && p.blocks.some(b => b.kind === 'ticker' || b.media?.[0]?.pano)) { const y = sheet.scrollTop; renderProject(p); setScroll(y); }
  });
  function blockEl(b) {
    if (b.kind === 'text') return textEl('blockquote', 'b-quote', b.quote || b.body || '');
    if (b.kind === 'full' && b.media[0].pano && PHONE.matches) { // panorama on phones
      const it = media[b.media[0].src], w = document.createElement('div'), f = mediaEl(b.media[0]);
      w.className = 'b-pano'; if (it) f.style.setProperty('--h', it.h + 'px'); w.append(f);
      pano(w); return w;
    }
    if (b.kind === 'full') return mediaEl(b.media[0]);
    if (b.kind === 'row') {
      const r = document.createElement('div'); r.className = 'b-row' + (b.stack === false ? ' keep' : '');
      const share = Math.round(100 / b.media.length);
      for (const m of b.media) r.append(mediaEl(m, { sizes: `(max-width: 543px) ${b.stack === false ? share : 100}vw, ${share}vw` }));
      return r;
    }
    if (b.kind === 'ticker') { // a strip on phones; on wider screens, rows of b.rows images each
      if (!PHONE.matches) {
        const g = document.createElement('div'); g.style.display = 'contents'; let i = 0;
        for (const n of b.rows) { g.append(blockEl({ kind: 'row', media: b.media.slice(i, i + n) })); i += n; }
        return g;
      }
      const t = document.createElement('div'), track = document.createElement('div');
      t.className = 'b-ticker'; track.className = 'track'; t.append(track);
      for (const copy of [0, 1, 2]) for (const m of b.media) {
        const it = media[m.src], f = mediaEl(m, { sizes: it ? Math.round(38 * it.w / it.h) + 'vh' : '100vw', eager: true });
        if (it) f.style.setProperty('--h', it.h + 'px');
        if (copy) f.setAttribute('aria-hidden', 'true');
        track.append(f);
      }
      ticker(t, track);
      return t;
    }
    if (b.kind === 'cols') {
      const g = document.createElement('div'); g.className = 'b-cols';
      for (const col of b.cols) {
        const d = document.createElement('div'); d.style.setProperty('--span', col.span);
        if (col.heading) d.append(textEl('h3', '', col.heading));
        if (col.body) d.append(textEl('p', '', col.body));
        for (const m of col.media || []) d.append(mediaEl(m, { sizes: `(max-width: 543px) 100vw, ${Math.round(col.span / 12 * 100)}vw` }));
        if (col.after) d.append(textEl('h3', '', col.after.heading), textEl('p', '', col.after.body));
        g.append(d);
      }
      return g;
    }
    return document.createElement('div');
  }

  /* zoom: tap an image for the largest size, or a zoomable video to play it large from the same moment */
  const zImg = zoom.querySelector('img'), zVid = zoom.querySelector('video');
  projView.addEventListener('click', e => {
    const el = e.target.closest('.zoomable'); if (!el) return;
    if (el.tagName === 'VIDEO') {
      zImg.hidden = true; zVid.hidden = false;
      if (zVid.src !== new URL(el.dataset.src, location.href).href) zVid.src = el.dataset.src;
      zVid.poster = el.poster; zVid.currentTime = el.currentTime || 0; zVid.play().catch(() => {});
    } else {
      zVid.hidden = true; zImg.hidden = false; zImg.src = el.dataset.zoom; zImg.alt = el.alt;
    }
    zoom.hidden = false;
  });
  function closeZoom() { zoom.hidden = true; zVid.pause(); }
  zoom.addEventListener('click', closeZoom);

  /* in-page links: cards, ← Projects, next project */
  sheet.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/projects"]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // new-tab clicks open the direct link
    e.preventDefault();
    const v = parse(a.getAttribute('href'));
    if (v.name === 'list' && view.name === 'project') up(); else go(v);
  });

  // Instagram preview: the embed loads on the first hover, sits beside the link, and stays while the
  // pointer moves onto it (so it can be scrolled); touch screens just follow the link
  const igBox = document.getElementById('ig-preview');
  let igHide = 0;
  document.addEventListener('pointerover', e => {
    const a = e.target.closest?.('.ig-link');
    if (e.pointerType !== 'mouse') return;
    if (a) {
      clearTimeout(igHide);
      if (!igBox.firstChild) igBox.innerHTML = '<iframe src="https://www.instagram.com/iprestin/embed/" title="Instagram: @iprestin" loading="lazy"></iframe>';
      const r = a.getBoundingClientRect(), W = 340, H = 374, m = 12;
      const top = r.top - H - m > 8 ? r.top - H - m : Math.min(innerHeight - H - 8, r.bottom + m);
      igBox.style.left = Math.max(8, Math.min(innerWidth - W - 8, r.left + r.width / 2 - W / 2)) + 'px';
      igBox.style.top = Math.max(8, top) + 'px';
      igBox.classList.add('show');
    } else if (e.target.closest?.('#ig-preview')) clearTimeout(igHide);
    else igHide = setTimeout(() => igBox.classList.remove('show'), 250);
  });
  document.getElementById('about-link').addEventListener('click', e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault(); toggleInfo(false); go({ name: 'about' });
  });

  /* Info: an overlay that leaves the page underneath (and your place in it) alone */
  function toggleInfo(open = !infoOpen) {
    infoOpen = open;
    about.classList.toggle('open', open);
    about.setAttribute('aria-hidden', String(!open));
    infoBtn.textContent = open ? 'Close' : 'Info';
  }
  infoBtn.addEventListener('click', () => { toggleSoon(false); toggleInfo(); });
  // "VCD / UX / UI": the coming-up card, which works the same way as Info (only one is open at a time)
  const soon = document.getElementById('soon'), soonBtn = document.getElementById('soon-btn');
  let soonOpen = false;
  function toggleSoon(open = !soonOpen) {
    soonOpen = open;
    soon.classList.toggle('open', open); soon.setAttribute('aria-hidden', String(!open));
    soonBtn.setAttribute('aria-expanded', String(open)); // keeps its name: a second "Close" beside Projects' would be confusing
  }
  soonBtn.addEventListener('click', () => { if (infoOpen) toggleInfo(false); toggleSoon(); });
  soon.addEventListener('click', e => { if (e.target === soon) toggleSoon(false); });
  projBtn.addEventListener('click', () => { if (infoOpen) toggleInfo(false); toggleSoon(false); view.name === 'home' ? go({ name: 'list' }) : up(); });
  about.addEventListener('click', e => { if (e.target === about) toggleInfo(false); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!zoom.hidden) closeZoom();
    else if (infoOpen) toggleInfo(false);
    else if (soonOpen) toggleSoon(false);
    else if (view.name !== 'home') up();
  });

  /* boot: load the data, then show whatever the address asks for (a direct link opens straight in) */
  const ready = Promise.all([
    // no-cache: always revalidate, so a browser never pairs fresh pages with stale project data
    fetch('projects.json', { cache: 'no-cache' }).then(r => r.json()),
    fetch('projects/media.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  ]).then(([d, m]) => { data = d; media = m; renderList(); });
  // a link to the list or one project opens straight into it (a refresh stays where you were)
  const first = parse(location.hash);
  history.replaceState({ view: first, scroll: 0 }, '', hrefOf(first));
  if (first.name !== 'home') ready.then(() => show(first, 0));
})();
