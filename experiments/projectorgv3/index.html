<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRESTIN ARTIS — projectorgv3 (masthead)</title>
  <style>
    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f2ed; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: default; }
    canvas.grab    { cursor: grab; }
    canvas.grabbing { cursor: grabbing; }
    canvas.pop     { cursor: pointer; }
    #glass { position: fixed; inset: 0; pointer-events: none; }
    #glass[hidden] { display: none; } /* `canvas{display:block}` would otherwise override [hidden] */

    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 18px 22px calc(18px + env(safe-area-inset-bottom, 0px));
      /* three columns so Projects sits on the true centre, whatever the side widths */
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      pointer-events: none;
      font-family: sans-serif; font-size: 11px; color: #111; letter-spacing: 0.04em;
    }
    footer > * { pointer-events: auto; }
    #info-btn { justify-self: end; }
    #info-btn, #projects-btn {
      background: none; border: none; cursor: pointer;
      font: inherit; color: inherit; letter-spacing: inherit;
      padding: 10px 12px; margin: -10px -12px; /* bigger tap target, same layout */
    }

    /* Projects: a sheet that slides up behind the footer */
    #projects { position: fixed; inset: 0; pointer-events: none; }
    /* only the sheet takes taps, so letters around it stay draggable */
    #projects.open .sheet { pointer-events: auto; }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: min(78vh, 760px);
      background: #fff; box-shadow: 0 -8px 40px rgba(0,0,0,.10);
      transform: translateY(100%); transition: transform .45s cubic-bezier(.2,.8,.2,1);
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 36px 22px calc(72px + env(safe-area-inset-bottom, 0px));
      font-family: sans-serif; color: #111;
    }
    #projects.open .sheet { transform: translateY(0); }
    /* while the sheet is up, the footer turns solid so cards scroll under it, not through its text */
    footer { transition: background-color .45s; }
    #projects.open ~ footer { background: #fff; }
    .sheet h2 {
      font-size: 11px; font-weight: normal; letter-spacing: 0.04em; text-transform: uppercase;
      max-width: 1200px; margin: 0 auto 24px;
    }
    .project-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr));
      gap: 28px 20px; max-width: 1200px; margin: 0 auto;
    }
    .project { font-size: 13px; line-height: 1.5; }
    .project .thumb { aspect-ratio: 4 / 3; background: #ece9e2; margin-bottom: 10px; }
    .project .meta { font-size: 11px; color: #777; letter-spacing: 0.04em; }
    @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }

    /* projectorgv3: the list fills the page below the masthead band; its slide is driven by the
       stage so its top edge rides the letters' floor (no CSS transition to race ahead of it) */
    .sheet { top: var(--sheet-top, 26vh); height: auto; transition: none; }

    /* test-only switcher: how letters that must swap places get past each other */
    #styles {
      position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px;
      display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px; padding: 3px; border-radius: 18px;
      max-width: calc(100vw - 32px);
      background: rgba(255,255,255,.85); box-shadow: 0 1px 6px rgba(0,0,0,.08);
      font-family: sans-serif; font-size: 11px; letter-spacing: 0.04em;
    }
    #styles button {
      background: none; border: none; cursor: pointer; font: inherit; color: #777;
      padding: 6px 10px; border-radius: 999px;
    }
    #styles button[aria-pressed="true"] { color: #111; background: #ece9e2; }

    #about {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    #about.open { opacity: 1; pointer-events: auto; }
    .card {
      background: #fff; padding: 48px 44px; max-width: 420px; width: 90%;
      box-shadow: 0 8px 40px rgba(0,0,0,.12);
      font-family: sans-serif; font-size: 13px; line-height: 1.7; color: #111;
    }
    .card a { color: inherit; }
    .links { list-style: none; margin-top: 22px; display: flex; gap: 20px; }
  </style>
</head>
<body>
  <canvas id="letters"></canvas>
  <canvas id="glass" hidden></canvas>

  <section id="about" aria-hidden="true">
    <div class="card">
      <p>Prestin Artis is a VCD / UX / UI designer.</p>
      <ul class="links">
        <li><a href="mailto:l25spam@gmail.com">Email</a></li>
      </ul>
    </div>
  </section>

  <section id="projects" aria-hidden="true" inert>
    <div class="sheet" role="dialog" aria-label="Projects">
      <h2>Projects</h2>
      <div class="project-grid">
        <!-- placeholder cards: swap in real projects (image in .thumb, title, meta) -->
        <article class="project"><div class="thumb"></div><p>Project title</p><p class="meta">Type · Year</p></article>
        <article class="project"><div class="thumb"></div><p>Project title</p><p class="meta">Type · Year</p></article>
        <article class="project"><div class="thumb"></div><p>Project title</p><p class="meta">Type · Year</p></article>
        <article class="project"><div class="thumb"></div><p>Project title</p><p class="meta">Type · Year</p></article>
        <article class="project"><div class="thumb"></div><p>Project title</p><p class="meta">Type · Year</p></article>
        <article class="project"><div class="thumb"></div><p>Project title</p><p class="meta">Type · Year</p></article>
      </div>
    </div>
  </section>

  <footer>
    <p>VCD / UX / UI</p>
    <button id="projects-btn" aria-expanded="false" aria-controls="projects">Projects</button>
    <button id="info-btn">Info</button>
  </footer>

  <nav id="styles" aria-label="Projects letter crossing (test)">
    <button type="button" data-style="makeway">Make way</button>
    <button type="button" data-style="shove">Shove</button>
    <button type="button" data-style="lastresort">Last resort</button>
    <button type="button" data-style="squeeze">Squeeze</button>
    <button type="button" data-style="around">Go around</button>
  </nav>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ArtisType — stroke-particle soft-body engine for hand-drawn letters.
   Each letter is built from its SVG stroke paths as a chain of particles held
   by distance links, curvature springs and shape recovery; letters collide
   through a spatial hash. Exposed as window.ArtisType = {Glyph, World}.
   ═══════════════════════════════════════════════════════════════════════════ */
(() => {
  'use strict';
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  class Glyph {
    constructor(shape,pose,index,customStrokes){
      const packing=Math.min(pose.packingCap||1.32,pose.packingScale||1);
      this.char=shape.char;this.index=index;this.w=pose.w*packing;this.h=pose.h*packing;this.angle=pose.angle||0;
      this.nodes=[];this.paths=[];this.links=[];this.bounds={};this.cx=pose.x;this.cy=pose.y;
      this.radius=Glyph.strokeRadius(this.char,this.w,this.h);
      const co=Math.cos(this.angle),si=Math.sin(this.angle);
      for(const stroke of customStrokes){
        const local=stroke.points.map(p=>({x:p.x*this.w,y:p.y*this.h}));
        let length=0;const lengths=[0];for(let i=1;i<local.length;i++){length+=Math.hypot(local[i].x-local[i-1].x,local[i].y-local[i-1].y);lengths.push(length)}
        const count=Math.max(3,Math.ceil(length/(this.radius*.6))),path=[];
        for(let i=0;i<=count;i++){
          if(stroke.closed&&i===count)break;
          const distance=length*i/count;let j=1;while(j<lengths.length-1&&lengths[j]<distance)j++;
          const t=(distance-lengths[j-1])/(lengths[j]-lengths[j-1]||1);
          const lx=local[j-1].x+(local[j].x-local[j-1].x)*t,ly=local[j-1].y+(local[j].y-local[j-1].y)*t;
          const reach=this.radius*(!stroke.closed&&(i===0||i===count)?1.1:.28);
          let n=null,best=reach;for(const m of this.nodes){const d=Math.hypot(m.lx-lx,m.ly-ly);if(d<best){n=m;best=d}}
          if(!n){const ox=lx*co-ly*si,oy=lx*si+ly*co;n={body:this,lx,ly,ox,oy,x:pose.x+ox,y:pose.y+oy,vx:0,vy:0,rx:this.radius,ry:this.radius};this.nodes.push(n)}
          if(path.at(-1)!==n)path.push(n);
        }
        for(let i=1;i<path.length;i++)this.link(path[i-1],path[i]);
        if(stroke.closed)this.link(path.at(-1),path[0]);
        this.paths.push({nodes:path,closed:!!stroke.closed});
      }
      const owners=new Map(this.nodes.map(n=>[n,new Set()]));this.paths.forEach((p,i)=>p.nodes.forEach(n=>owners.get(n).add(i)));
      for(const a of this.nodes)for(const b of this.nodes){
        if(a===b||this.nodes.indexOf(a)>this.nodes.indexOf(b)||[...owners.get(a)].some(i=>owners.get(b).has(i)))continue;
        if(Math.hypot(a.ox-b.ox,a.oy-b.oy)<this.radius*2.2)this.link(a,b);
      }
      this.update();
    }
    static strokeRadius(c,w,h){return c==='I'?Math.max(6,h*.14):Math.max(6,Math.min(w*.25,h*({E:.14,R:.14,'4':.1,'0':.11}[c]??.17)))}
    link(a,b){this.links.push({a,b,length:Math.hypot(a.ox-b.ox,a.oy-b.oy)})}
    update(){
      let x=0,y=0,minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
      for(const n of this.nodes){x+=n.x;y+=n.y;minX=Math.min(minX,n.x-n.rx);maxX=Math.max(maxX,n.x+n.rx);minY=Math.min(minY,n.y-n.ry);maxY=Math.max(maxY,n.y+n.ry)}
      this.cx=x/this.nodes.length;this.cy=y/this.nodes.length;this.bounds={minX,maxX,minY,maxY};
    }
    hitTest(p){return this.nodes.some(n=>((p.x-n.x)/n.rx)**2+((p.y-n.y)/n.ry)**2<=1.1)}
  }
  class World {
    static floorInset=0; // px reserved below the floor (footer strip)
    get floorY(){return this.height-World.floorInset}
    constructor(width,height,glyphs){
      this.width=width;this.height=height;this.glyphs=glyphs;this.nodes=glyphs.flatMap(g=>g.nodes);this.drag=null;this.energy=1;this.reducedMotion=false;
      this.fitBase={scale:1,v:0};this.fitGoal=1;
      this.redistActive=false;
      this._meas={collMs:0,collPairs:0,collHits:0};this._measOn=false;
      this.nodes.forEach((n,i)=>n.id=i);
      this.neighbors=new Set();for(const g of glyphs)for(const a of g.nodes)for(const b of g.nodes)if(a.id<b.id&&Math.hypot(a.ox-b.ox,a.oy-b.oy)<g.radius*2.1)this.neighbors.add(a.id+':'+b.id);
      for(const g of glyphs)for(const l of g.links)this.neighbors.add(Math.min(l.a.id,l.b.id)+':'+Math.max(l.a.id,l.b.id));
      for(let i=0;i<25;i++)this.solve();for(const g of glyphs)g.update();this.sleep();
    }
    grab(g,p){const node=g.nodes.reduce((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)<Math.hypot(b.x-p.x,b.y-p.y)?a:b);this.drag={glyph:g,node,x:p.x,y:p.y,dx:node.x-p.x,dy:node.y-p.y}}
    release(){this.drag=null}
    sleep(){for(const n of this.nodes)n.vx=n.vy=0;this.energy=0}
    resize(w,h){
      if(!this.fitBase.w){this.fitBase.w=this.width;this.fitBase.h=this.height;}
      if(this.width>0&&this.height>0){
        let lMinX=Infinity,lMaxX=-Infinity,lMinY=Infinity,lMaxY=-Infinity;
        for(const g of this.glyphs){lMinX=Math.min(lMinX,g.cx);lMaxX=Math.max(lMaxX,g.cx);lMinY=Math.min(lMinY,g.cy);lMaxY=Math.max(lMaxY,g.cy);}
        const lW=lMaxX-lMinX,lH=lMaxY-lMinY,lCX=(lMinX+lMaxX)/2,lCY=(lMinY+lMaxY)/2;
        const fh=h-World.floorInset;
        const s=(lW>1&&lH>1)?Math.min(w*0.96/lW,fh*0.96/lH):1;
        for(const g of this.glyphs){
          if(g===this.drag?.glyph){g._rdx=0;g._rdy=0;}
          else{g._rdx=(g.cx-lCX)*s+w/2-g.cx;g._rdy=(g.cy-lCY)*s+fh/2-g.cy;}
        }
        this.redistActive=true;
      }
      this.width=w;this.height=h;this.target={w,h};this.energy=1;
    }
    get busy(){return !!this.target||this.redistActive||this.glyphs.some(g=>g.puff)||this.returning>0}
    followResize(){
      if(!this.target)return;
      const t=this.target,b=this.fitBase;
      let goal=Math.sqrt(t.w*t.h/(b.w*b.h));if(goal<1)goal**=.75;
      this.fitGoal=goal;
      b.v+=((goal-b.scale)*30-b.v*8)/60;const k=(b.scale+b.v/60)/b.scale;b.scale+=b.v/60;
      for(const g of this.glyphs)this.scaleGlyph(g,k);
      if(Math.abs(goal-b.scale)<.0005&&Math.abs(b.v)<.0005)this.target=null;
    }
    followRedist(){
      if(!this.redistActive)return;
      let anyLeft=false;
      for(const g of this.glyphs){
        if(g===this.drag?.glyph){g._rdx=0;g._rdy=0;continue;}
        if(g._rdx===undefined)continue;
        if(Math.abs(g._rdx)>.25||Math.abs(g._rdy)>.25){
          anyLeft=true;
          const moveX=g._rdx*.06,moveY=g._rdy*.06;
          for(const n of g.nodes){n.x+=moveX;n.y+=moveY}
          g._rdx-=moveX;g._rdy-=moveY;
          g.update();
        }
      }
      if(!anyLeft){for(const g of this.glyphs){g._rdx=0;g._rdy=0;}this.redistActive=false;}
    }
    scaleGlyph(g,k){
      g.update();g.w*=k;g.h*=k;g.radius*=k;
      for(const n of g.nodes){n.ox*=k;n.oy*=k;n.rx*=k;n.ry*=k;n.x=g.cx+(n.x-g.cx)*k;n.y=g.cy+(n.y-g.cy)*k}
      for(const l of g.links)l.length*=k;
    }
    solve(){
      for(const g of this.glyphs){
        for(const l of g.links){const dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.hypot(dx,dy)||1;
          const rest=l.length,k=(d-rest)/d*.24;
          l.a.x+=dx*k;l.a.y+=dy*k;l.b.x-=dx*k;l.b.y-=dy*k;
        }
        for(const path of g.paths){
          const nodes=path.nodes,start=path.closed?0:1,end=path.closed?nodes.length:nodes.length-1;
          for(let i=start;i<end;i++){
            const n=nodes[i],a=nodes[(i-1+nodes.length)%nodes.length],b=nodes[(i+1)%nodes.length];
            const dx=((a.x+b.x)/2-n.x+(n.ox-(a.ox+b.ox)/2))*.18;
            const dy=((a.y+b.y)/2-n.y+(n.oy-(a.oy+b.oy)/2))*.18;
            n.x+=dx;n.y+=dy;a.x-=dx/2;a.y-=dy/2;b.x-=dx/2;b.y-=dy/2;
          }
        }
      }
      const _doMeas=this._measOn;
      const _ct0=_doMeas?performance.now():0;let _cp=0,_ch=0;
      const cell=Math.max(16,...this.nodes.map(n=>Math.max(n.rx,n.ry)*2+3)),grid=new Map();
      for(const a of this.nodes){
        const gx=Math.floor(a.x/cell),gy=Math.floor(a.y/cell);
        for(let x=gx-1;x<=gx+1;x++)for(let y=gy-1;y<=gy+1;y++)for(const b of grid.get(x+','+y)||[]){
          if(a.body===b.body&&this.neighbors.has(b.id+':'+a.id))continue;
          if(a.body!==b.body&&a.body._passes?.has(b.body))continue; // a pair that must swap places slips past
          _cp++;
          const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||.001,nx=dx/d,ny=dy/d;
          const ra=Math.hypot(a.rx*nx,a.ry*ny),rb=Math.hypot(b.rx*nx,b.ry*ny),overlap=ra+rb+1.8-d;
          if(overlap>0){const k=overlap*.5;a.x+=nx*k;a.y+=ny*k;b.x-=nx*k;b.y-=ny*k;_ch++;}
        }
        const key=gx+','+gy;if(!grid.has(key))grid.set(key,[]);grid.get(key).push(a);
      }
      if(_doMeas){this._meas.collMs+=performance.now()-_ct0;this._meas.collPairs+=_cp;this._meas.collHits+=_ch;}
      for(const n of this.nodes){n.x=clamp(n.x,n.rx+3,this.width-n.rx-3);n.y=clamp(n.y,n.ry+3,this.floorY-n.ry-3)}
    }
    step(){
      this.followResize();this.followRedist();
      const old=this.nodes.map(n=>[n.x,n.y]);
      for(const g of this.glyphs){
        g.update();
        const meanX=g.nodes.reduce((s,n)=>s+n.ox,0)/g.nodes.length,meanY=g.nodes.reduce((s,n)=>s+n.oy,0)/g.nodes.length;
        for(const n of g.nodes){
          const tx=g.cx+(n.ox-meanX),ty=g.cy+(n.oy-meanY);
          n.vx+=(tx-n.x)*.024;n.vy+=(ty-n.y)*.024;
        }
      }
      const move=this.nodes.map(n=>[n.vx,n.vy]);let held=null;
      if(this.drag){const d=this.drag,n=d.node,mx=clamp(d.x+d.dx-n.x,-60,60),my=clamp(d.y+d.dy-n.y,-60,60);
        for(const m of d.glyph.nodes){move[m.id][0]+=mx*.2;move[m.id][1]+=my*.2}
        held={n,x0:n.x,y0:n.y,x:n.x+mx,y:n.y+my}}
      let far=0,thin=Infinity;
      for(const n of this.nodes)thin=Math.min(thin,n.rx,n.ry);
      for(const [x,y] of move)far=Math.max(far,Math.hypot(x,y));
      if(held)far=Math.max(far,Math.hypot(held.x-held.x0,held.y-held.y0));
      const steps=clamp(Math.ceil(far/(thin*.5)),1,8),passes=Math.ceil(6/steps);
      for(let s=1;s<=steps;s++){
        this.nodes.forEach((n,i)=>{n.x+=move[i][0]/steps;n.y+=move[i][1]/steps});
        for(let i=0;i<passes;i++){this.solve();if(held){const t=s/steps;
          held.n.x=held.x0+(held.x-held.x0)*t;held.n.y=held.y0+(held.y-held.y0)*t;
          held.n.x=clamp(held.n.x,held.n.rx+3,this.width-held.n.rx-3);
          held.n.y=clamp(held.n.y,held.n.ry+3,this.floorY-held.n.ry-3);}}
      }
      let e=0;this.nodes.forEach((n,i)=>{n.vx=clamp((n.x-old[i][0])*(this.reducedMotion?.7:.94),-30,30);n.vy=clamp((n.y-old[i][1])*(this.reducedMotion?.7:.94),-30,30);e+=n.vx*n.vx+n.vy*n.vy});
      this.energy=Math.sqrt(e/this.nodes.length);for(const g of this.glyphs)g.update();
    }
  }
  window.ArtisType={Glyph,World};
})();

/* ═══════════════════════════════════════════════════════════════════════════
   SVG PATH PARSER
   ═══════════════════════════════════════════════════════════════════════════ */
(() => {
  'use strict';
  function flattenSvgPath(d){
    const out=[];let cx=0,cy=0,sx=0,sy=0;
    const chunks=d.match(/[MmLlHhVvCcQqZz][^MmLlHhVvCcQqZz]*/g)||[];
    const add=(x,y)=>out.push({x,y});
    const cubicTo=(x0,y0,x1,y1,x2,y2,x3,y3)=>{
      const n=Math.max(4,Math.ceil((Math.hypot(x1-x0,y1-y0)+Math.hypot(x2-x1,y2-y1)+Math.hypot(x3-x2,y3-y2))/6));
      for(let k=1;k<=n;k++){const t=k/n,u=1-t;add(u*u*u*x0+3*u*u*t*x1+3*u*t*t*x2+t*t*t*x3,u*u*u*y0+3*u*u*t*y1+3*u*t*t*y2+t*t*t*y3)}
    };
    const quadTo=(x0,y0,x1,y1,x2,y2)=>{
      const n=Math.max(3,Math.ceil(Math.hypot(x2-x0,y2-y0)/5));
      for(let k=1;k<=n;k++){const t=k/n,u=1-t;add(u*u*x0+2*u*t*x1+t*t*x2,u*u*y0+2*u*t*y1+t*t*y2)}
    };
    for(const chunk of chunks){
      const cmd=chunk[0];
      const args=chunk.slice(1).trim().split(/[\s,]+/).filter(Boolean).map(Number);
      let i=0;
      const n=(k=1)=>{const r=[];for(let j=0;j<k;j++)r.push(args[i++]??0);return r};
      switch(cmd){
        case 'M':{const[x,y]=n(2);cx=x;cy=y;sx=x;sy=y;add(cx,cy);break}
        case 'm':{const[dx,dy]=n(2);cx+=dx;cy+=dy;sx=cx;sy=cy;add(cx,cy);break}
        case 'L':while(i<args.length){const[x,y]=n(2);cx=x;cy=y;add(cx,cy)}break;
        case 'l':while(i<args.length){const[dx,dy]=n(2);cx+=dx;cy+=dy;add(cx,cy)}break;
        case 'H':while(i<args.length){cx=args[i++];add(cx,cy)}break;
        case 'h':while(i<args.length){cx+=args[i++];add(cx,cy)}break;
        case 'V':while(i<args.length){cy=args[i++];add(cx,cy)}break;
        case 'v':while(i<args.length){cy+=args[i++];add(cx,cy)}break;

      minY=Math.min(minY,p.y-rh); maxY=Math.max(maxY,p.y+rh);
    }
    return { minX,maxX,minY,maxY,
      cx:(minX+maxX)/2, cy:(minY+maxY)/2,
      w:maxX-minX, h:maxY-minY };
  }

  /* ── Scoring ─────────────────────────────────────────────────────────── */
  function scoreComp(compIdx, vpW, vpH) {
    const b = compBBox(compIdx);
    const s = Math.min(vpW*0.96/b.w, vpH*0.96/b.h);
    return (s*b.w/vpW) * (s*b.h/vpH);
  }

  function pickComp(vpW, vpH) {
    let best=0, bestScore=-1;
    for (let i=0; i<COMPS.length; i++) {
      const score = scoreComp(i, vpW, vpH);
      if (score > bestScore) { bestScore=score; best=i; }
    }
    return best;
  }

  /* ── Diagnostics — logged once after SVGs load ───────────────────────── */
  function logDiagnostics() {

    const analyseYSpread = (compIdx) => {

      console.log(`  Avg visual letter height: ${avgH.toFixed(0)}px  →  spread ratio: ${(spread/avgH).toFixed(2)}× letter-height`);
      if (spread/avgH > 1) console.warn('  ⚠ Spread > 1 letter-height: letters will form separate bands');
      console.log('  Letters sorted by Y:');

        const dev=p.y-center;
        console.log(`    ${p.char}  y=${p.y.toFixed(1)}  (${dev>=0?'+':''}${dev.toFixed(1)})`);

    };
    analyseYSpread(0); // 1 row original
    analyseYSpread(1); // 1 row balanced

      });

  /* ── Fit authored composition uniformly ─────────────────────────────── */
  function fitAuthored(compIdx, vpW, vpH) {
    const comp = COMPS[compIdx];
    const bbox = compBBox(compIdx);
    const s  = Math.min(vpW*0.96/bbox.w, vpH*0.96/bbox.h);
    const tx = vpW/2 - bbox.cx*s;
    const ty = vpH/2 - bbox.cy*s;
    const wFill = Math.round(s*bbox.w/vpW*100);
    const hFill = Math.round(s*bbox.h/vpH*100);
    console.log(`[cc_v13] fitAuthored "${comp.name}" at ${vpW}×${vpH}: fill ${wFill}%W × ${hFill}%H (scale ${s.toFixed(4)})`);
    return comp.poses.map(p => ({
      char: p.char, svgIdx: p.svgIdx,
      pose: { x:p.x*s+tx, y:p.y*s+ty, w:p.w*s, h:p.w*s, angle:p.angle },
    }));
  }

  /* ── Generated composition: uniform-scale auto-fill ─────────────────── */
  function computeGenerated(W, H, comp) {
    const K      = comp.rows.length;
    const padTop = H*0.06;
    const bandH  = (H*0.88)/K;
    const maxW   = W*0.94;
    const allIdx = comp.rows.flat();
    let scale = bandH / Math.max(...allIdx.map(li=>cachedInfos[li].normH));
    for (const row of comp.rows) {
      const rowNW = row.reduce((s,li)=>s+cachedInfos[li].normW,0);
      if (rowNW*scale > maxW) scale=maxW/rowNW;
    }
    const out=[];
    comp.rows.forEach((row,ri) => {
      const cy = padTop+bandH*ri+bandH*0.5;
      const widths = row.map(li=>cachedInfos[li].normW*scale);
      const totalW = widths.reduce((s,w)=>s+w,0);
      let x=(W-totalW)/2;
      row.forEach((li,i) => {
        out.push({char:ALL_CHARS[li], svgIdx:li,
          pose:{x:x+widths[i]/2, y:cy, w:scale, h:scale, angle:0}});
        x+=widths[i];
      });
    });
    return out;
  }

  /* ── Resolve composition defs ────────────────────────────────────────── */
  function getDefs(compIdx) {
    const comp = COMPS[compIdx];
    const fh = height - ArtisType.World.floorInset;
    return comp.authored
      ? fitAuthored(compIdx, width, fh)
      : computeGenerated(width, fh, comp);
  }

  /* ── Build world ─────────────────────────────────────────────────────── */
  function build(compIdx) {
    if (!cachedInfos) return;
    cancelAnimationFrame(raf); raf=0; prevTime=0; accum=0; intro.cancelHome();
    ready=false; rendered.clear(); renderDirty=true;
    quietFrames=0; _restoredThisCycle=false;

    const defs   = getDefs(compIdx);
    const glyphs = defs.map(({char,svgIdx,pose},i) => {
      const g = new ArtisType.Glyph({char}, pose, i, cachedInfos[svgIdx].strokes);
      g.z=i; g.svgIdx=svgIdx; return g;
    });
    world = new ArtisType.World(width, height, glyphs);
    fitBBox = compBBox(compIdx);
    refFitS = Math.min(width*0.96/fitBBox.w, height*0.96/fitBBox.h);
    world.reducedMotion = reduced.matches;
    ready=true; renderDirty=true;
    if (intro.active) intro.attach();
    draw(); wake();
  }

  /* ── Sleep-snap Mode B ───────────────────────────────────────────────── */
  // Restores rest shape around each letter's current centroid — not original position.
  function popDeformedGlyphs() {
    if (!world) return;
    for (const g of world.glyphs) {
      if (g===world.drag?.glyph) continue;
      const mx=g.nodes.reduce((s,n)=>s+n.ox,0)/g.nodes.length;
      const my=g.nodes.reduce((s,n)=>s+n.oy,0)/g.nodes.length;
      for (const n of g.nodes) {
        n.x=g.cx+(n.ox-mx); n.y=g.cy+(n.oy-my);
        n.vx=0; n.vy=0;
      }
      g.update();
    }
    renderDirty=true;
  }

  /* ── Diagnostics HUD ────────────────────────────────────────────────── */
  function drawHUD(){
    if(!world)return;
    const last=meas._frames.length?meas._frames.at(-1):null;
    ctx.save();
    ctx.font='11px monospace';
    ctx.fillStyle='rgba(0,0,0,0.65)';
    ctx.fillText(
      `FPS:${_mFps}  phys:${last?last.physics_ms:0}ms  rend:${last?last.render_ms:0}ms  total:${last?last.total_ms:0}ms`,
      10,18
    );
    ctx.fillText(
      `raf: interval:${_mSmooth.interval.toFixed(1)}ms  lag:${_mSmooth.lag.toFixed(1)}ms`,
      10,32
    );
    ctx.fillText(
      `coll:${last?last.coll_ms:0}ms  pairs:${last?last.coll_pairs:0}  hits:${last?last.coll_hits:0}  particles:${world.nodes.length}`,
      10,46
    );
    ctx.fillText(
      `energy:${world.energy.toFixed(4)}  quiet:${quietFrames}/40  redist:${world.redistActive?'YES':'no'}  scale:${world.fitBase.scale.toFixed(3)}→${world.fitGoal.toFixed(3)}`,
      10,60
    );
    ctx.fillText(
      `steps/f:${last?last.steps_per_frame:0}  sim:${(_simTime/1000).toFixed(1)}s  drag:${world.drag?'YES':'no'}  rec:${replay.recording?'REC':'no'}  rep:${replay.replaying?'PLAY':'no'}  anim:${_mbAnim?((performance.now()-_mbAnim.startMs)/MB_ANIM_MS*100).toFixed(0)+'%':'--'}  [M]hide [C]csv`,
      10,74
    );
    ctx.restore();
  }

  /* ── Physics loop (cc_v4-timing accumulator) ─────────────────────────── */
  function frame(time) {
    raf=0;
    _loopFrame++;
    replay.tick();
    const cbStart=performance.now();
    _mRawLag=cbStart-time;
    _mRawInterval=_mPrevTs>0?time-_mPrevTs:0;
    _mPrevTs=time;
    const EMA=0.1;
    if(_mRawInterval>0)_mSmooth.interval+=EMA*(_mRawInterval-_mSmooth.interval);
    _mSmooth.lag+=EMA*(_mRawLag-_mSmooth.lag);
    _mFpsFrames++;
    if(time-_mFpsLast>=1000){_mFps=_mFpsFrames;_mFpsFrames=0;_mFpsLast=time;}
    if (document.hidden||!world||!ready) { prevTime=0; return; }
    if(prevTime===0){_simTime=0;_realStartTime=time;}
    const rawDelta=prevTime>0 ? time-prevTime : FIXED_DT;
    if(!_animOnly)accum+=Math.min(rawDelta,MAX_DELTA);
    prevTime=time;
    world._measOn=_measOn;
    world._meas.collMs=world._meas.collPairs=world._meas.collHits=0;
    const physStart=performance.now();
    let steps=0;
    if(!_animOnly){while (accum>=FIXED_DT && steps<MAX_STEPS) { intro.homeStep(); stage.step(); world.step(); renderDirty=true; accum-=FIXED_DT; steps++; _simTime+=FIXED_DT; }}
    const physMs=performance.now()-physStart;
    const realElapsed=time-_realStartTime;
    const rendStart=performance.now();
    tickModeBAnim();
    draw();
    const rendMs=performance.now()-rendStart;
    const totalMs=performance.now()-cbStart;
    // Update quiet state before recording so CSV reflects this frame's final values
    const quiet=!world.drag&&!world.busy&&world.energy<.08;
    quietFrames=quiet?quietFrames+1:0;
    let _modeB=0;
    if (!_restoredThisCycle&&quietFrames===38) {
      // Capture deformed state before physics snap
      const glyphData=world.glyphs.filter(g=>g!==world.drag?.glyph).map(g=>({
        g, cx:g.cx, cy:g.cy, fromNodes:g.nodes.map(n=>({x:n.x,y:n.y})),
      }));
      popDeformedGlyphs();
      _restoredThisCycle=true; _modeB=1;
      // Capture restored state and compute rotation delta
      for(const d of glyphData){
        d.toNodes=d.g.nodes.map(n=>({x:n.x,y:n.y}));
        let cross=0,dot=0;
        for(let i=0;i<d.g.nodes.length;i++){
          const fx=d.fromNodes[i].x-d.cx,fy=d.fromNodes[i].y-d.cy;
          const tx=d.toNodes[i].x-d.cx,ty=d.toNodes[i].y-d.cy;
          const mag=Math.hypot(fx,fy)*Math.hypot(tx,ty)||.001;
          cross+=(fx*ty-fy*tx)/mag; dot+=(fx*tx+fy*ty)/mag;
        }
        d.deltaAngle=Math.atan2(cross,dot);
      }
      _mbAnim={startMs:performance.now(),glyphs:glyphData};
    }
    if(_measOn){
      const glf={};
      world.glyphs.forEach((g,i)=>{
        let vmax=0;for(const n of g.nodes){const s=n.vx*n.vx+n.vy*n.vy;if(s>vmax)vmax=s;}
        glf[`L${i}_cx`]=+g.cx.toFixed(1);glf[`L${i}_cy`]=+g.cy.toFixed(1);
        glf[`L${i}_vmax`]=+Math.sqrt(vmax).toFixed(3);
        glf[`L${i}_rdx`]=+(g._rdx||0).toFixed(3);glf[`L${i}_rdy`]=+(g._rdy||0).toFixed(3);
      });
      meas.push({
        frame:meas._fn++,timestamp_ms:+time.toFixed(0),fps:_mFps,
        physics_ms:+physMs.toFixed(2),render_ms:+rendMs.toFixed(2),total_ms:+totalMs.toFixed(2),
        raf_interval_ms:+_mRawInterval.toFixed(2),raf_lag_ms:+_mRawLag.toFixed(2),
        coll_ms:+(world._meas.collMs).toFixed(2),
        coll_particles:world.nodes.length,
        coll_pairs:world._meas.collPairs,coll_hits:world._meas.collHits,
        steps_per_frame:steps,sim_time_ms:+_simTime.toFixed(0),real_time_ms:+realElapsed.toFixed(0),
        dragging:world.drag?1:0,energy:+world.energy.toFixed(4),
        quiet_frames:quietFrames,sleep:quietFrames>=40?1:0,mode_b:_modeB,
        redist_active:world.redistActive?1:0,
        fit_scale:+world.fitBase.scale.toFixed(4),fit_goal:+world.fitGoal.toFixed(4),
        vp_w:width,vp_h:height,
        ...glf,
      });
    }
    // Physics sleeps at frame 40 unconditionally
    if (quietFrames>=40&&!_animOnly) {
      world.sleep(); prevTime=0; accum=0; _animOnly=true;
      if(_autoDownload){_autoDownload=false;meas.download();}
    }
    // RAF continues only while physics active or visual animation running
    if (quietFrames<40||_mbAnim) raf=requestAnimationFrame(frame);
  }

  function wake() {
    if (intro.active) return; // world is held until the bubble intro hands off
    cancelModeBAnim();
    if(_animOnly) accum=0;
    _animOnly=false;
    quietFrames=0; _restoredThisCycle=false;
    if (!raf&&!document.hidden) { prevTime=0; raf=requestAnimationFrame(frame); }
  }

  /* ── Rendering ───────────────────────────────────────────────────────── */
  function prepareLetter(glyph) {
    const rx=glyph.nodes[0].rx/glyph.radius, ry=glyph.nodes[0].ry/glyph.radius;
    const paths=glyph.paths.map(stroke=>{
      const nodes=stroke.nodes, count=nodes.length, path=new Path2D();
      const ax=n=>n._animX??n.x, ay=n=>n._animY??n.y;
      const at=n=>[ax(n)/rx,ay(n)/ry], mid=(a,b)=>[(ax(a)+ax(b))/2/rx,(ay(a)+ay(b))/2/ry];
      let last=null;
      const to=(x,y)=>{if(!last)path.moveTo(x,y);else if(Math.hypot(x-last[0],y-last[1])<.05)return;else path.lineTo(x,y);last=[x,y]};
      const curve=(p0,c,p1)=>{
        const ax=c[0]-p0[0],ay=c[1]-p0[1],bx=p1[0]-c[0],by=p1[1]-c[1];
        const pieces=clamp(Math.ceil(Math.abs(Math.atan2(ax*by-ay*bx,ax*bx+ay*by))/.1),1,24);
        for(let k=1;k<=pieces;k++){const t=k/pieces,u=1-t;to(u*u*p0[0]+2*u*t*c[0]+t*t*p1[0],u*u*p0[1]+2*u*t*c[1]+t*t*p1[1])}
      };
      if(stroke.closed){
        let start=mid(nodes.at(-1),nodes[0]);to(...start);
        for(let i=0;i<count;i++){const end=mid(nodes[i],nodes[(i+1)%count]);curve(start,at(nodes[i]),end);start=end}
        path.closePath();
      } else {
        let start=at(nodes[0]);to(...start);
        for(let i=1;i<count-1;i++){const end=mid(nodes[i],nodes[i+1]);curve(start,at(nodes[i]),end);start=end}
        if(count>1)to(...at(nodes.at(-1)));
        if(count===1)path.lineTo(...start);
      }
      return path;
    });
    return {paths,rx,ry};
  }

  function drawSolid(glyph, drawing) {
    const halo=Math.max(1.5,Math.min(4.5,Math.min(width,height)*.0035));
    ctx.save(); ctx.scale(drawing.rx,drawing.ry); ctx.lineCap='round'; ctx.lineJoin='round';
    const band=halo*2/Math.sqrt(drawing.rx*drawing.ry);
    ctx.strokeStyle='rgba(244,242,237,0.97)'; ctx.lineWidth=glyph.radius*2+band;
    for(const p of drawing.paths)ctx.stroke(p);
    ctx.strokeStyle=COLOR; ctx.lineWidth=glyph.radius*2;
    for(const p of drawing.paths)ctx.stroke(p);
    ctx.restore();
  }

  function draw() {
    if (!world||!ready||intro.active) return;
    ctx.setTransform(ratio,0,0,ratio,0,0);
    ctx.fillStyle='#f4f2ed';
    ctx.fillRect(0,0,width,height);
    const sorted=[...world.glyphs].sort((a,b)=>(a.z||0)-(b.z||0));
    for (const g of sorted) {
      if (renderDirty||g._pathDirty||!rendered.has(g.index)) {
        rendered.set(g.index, prepareLetter(g));
        g._pathDirty=false;
      }
      drawSolid(g, rendered.get(g.index));
    }
    stage.drawOver(ctx);
    if(_measOn)drawHUD();
    renderDirty=false;
  }

  /* ── Projects masthead (projectorgv3) ─────────────────────────────────── */
  // Opening Projects lifts the list from the bottom, and the list's top edge rides the letters'
  // floor: it's the list that shoves them up into the band above, where they steer into the
  // site's one-row layout for that sliver. Steering is projectorgv1's: it pushes on velocity,
  // so letters keep real momentum, overshoot, bump and squish. Closing always flies to a fresh
  // homepage layout for the current window, never back to where they were before.
  // How letters that must swap places get past each other is a test toggle (top right,
  // mirrored in the URL hash):
  //   makeway     nothing passes: lanes. Opening, the lower rows first slide sideways under the
  //               top row (separate rows, so nothing's in the way), then rise into the space it
  //               has cleared. Closing, the lower rows first drop out of the band, then slide
  //               into place, while the top row waits a beat before spreading out.
  //   shove       nothing passes: everyone goes at once and pushes; a jam is allowed to stand
  //   lastresort  nothing passes, unless a letter is pinned short of its spot for ~1 s: then it
  //               alone slips past what it's touching
  //   squeeze     makeway's lanes; a letter blocked for ~0.5 s by one ahead of it shrinks, slips
  //               through the gap, and springs back to size near its spot (never overlaps)
  //   around      makeway's lanes; a letter blocked for ~0.5 s detours to a point beside the
  //               letter in its way (the side with room on screen), then heads on to its spot
  // Bursting out of the intro bubble is the exception, whatever the toggle: as in projectorgv1,
  // letters whose paths cross slip past each other to untangle.
  const stage = (() => {
    const STYLES=['makeway','shove','lastresort','squeeze','around'];
    const LANES=['makeway','squeeze','around']; // styles built on makeway's lanes
    const SQ=.55, STUCK=30, COOL=30; // squeeze scale; steps without getting closer before acting; steps before acting again
    let style=STYLES.includes(location.hash.slice(1))?location.hash.slice(1):'makeway';
    let open=false, fly=[], engaged=false;
    let footer=0, floor=null, floorGoal=null, band=0, popRing=null;
    const projEl=document.getElementById('projects'), listEl=projEl.querySelector('.sheet');
    const WAIT=24; // makeway, closing: steps the top row waits for the lower rows to drop (0.4 s)

    // The site's own layout for a w×h space: the same pick the homepage makes for the window
    function defsFor(w,h){
      const i=pickComp(w,h);
      return COMPS[i].authored?fitAuthored(i,w,h):computeGenerated(w,h,COMPS[i]);
    }
    // The homepage formation for the current window
    function homeLayout(){
      const by=new Map(defsFor(width,height-footer).map(d=>[d.svgIdx,d.pose]));
      Object.assign(world.fitBase,{w:width,h:height,scale:1,v:0});world.target=null; // later resizes scale from here
      return world.glyphs.map(g=>{const p=by.get(g.svgIdx);return p?{g,x:p.x,y:p.y,w:p.w}:{g}});
    }
    // Never wait on the intro: pop its bubble (or stop its post-pop homing) and take the letters now.
    // Returns true when it popped the bubble: the letters burst out of a jumbled cluster.
    function takeOver(){
      const h=intro.active?intro.popNow():intro.releaseHome();
      if(h?.ring)popRing={...h.ring,a:1};
      return !!h?.ring;
    }
    // Row index (top row 0) for each y: a new row starts more than ~half a letter below the last
    function rowsOf(ys,hs){
      const gap=[...hs].sort((a,b)=>a-b)[hs.length>>1]*.6;
      const order=ys.map((y,i)=>i).sort((a,b)=>ys[a]-ys[b]),rows=[];let r=0;
      order.forEach((i,k)=>{if(k&&ys[i]-ys[order[k-1]]>gap)r++;rows[i]=r});
      return rows;
    }

    // Targets: {g, x, y, w}. Omit x/y to only rescale; w is the goal glyph width.
    // pass: the bubble burst (pairs that must swap slip past).
    // makeway lanes: opening, rows below the top slide sideways first ('x' leg), then rise;
    // closing, letters bound for the lower rows drop first ('y' leg) and the top row waits.
    function flyTo(list,{pass=false,lanes=null}={}){
      const rows=lanes&&LANES.includes(style)?rowsOf(lanes.ys,lanes.hs):null;
      fly=list.map((t,i)=>{
        const prev=fly.find(f=>f.g===t.g),steer=t.x!=null,lower=rows&&rows[i]>0;
        return {g:t.g,tx:t.x,ty:t.y,steer,pass:pass&&steer,s:1,sv:prev?prev.sv:0,goal:t.w?t.w/t.g.w:1,
          steps:0,fade:0,slow:0,slip:false,sq:0,wp:null,cool:0,fin:t.w?t.w/t.g.w:1,best:Infinity,since:0,
          leg:lower?(lanes.closing?'y':'x'):null,wait:rows&&lanes.closing&&!lower?WAIT:0};
      });
    }
    function toBand(burst){
      band=Math.round(clamp(height*(width<height?.3:.22),120,280));
      floorGoal=height-band;
      projEl.style.setProperty('--sheet-top',band+'px');
      const cx=width/2,cy=band/2,by=new Map(defsFor(width,band).map(d=>[d.svgIdx,d.pose]));
      const list=world.glyphs.map(g=>{const p=by.get(g.svgIdx);
        return p?{g,x:cx+(p.x-cx)*.9,y:cy+(p.y-cy)*.9,w:p.w*.9}:{g}});
      // the burst is all at once, as projectorgv1's pop; otherwise rows leave top first
      flyTo(list,burst?{pass:true}:{lanes:{ys:world.glyphs.map(g=>g.cy),hs:world.glyphs.map(g=>g.h)}});
    }

      const beads=!(glass.ok&&glass.oil()); // LG3 pops clean, no droplets
      for(let i=0;i<14&&!rm&&beads;i++){const a=popAng+rnd(-.9,.9),v=rnd(2,7);
        drops.push({x:pt.x,y:pt.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rnd(1,2.6),life:1,hue:rnd(0,360)})}
    }

    /* LG4: the throw routes each letter out of the burst toward its spot; halfway
       through, while they're still flying fast, the real World takes over with their
       live velocities. A homing force applied from outside the World (like drag;
       World code untouched) steers the final approach, so the letters genuinely
       collide as they arrive, then fades out and leaves plain cc_v27 physics. */
    let homing=null;
    function launchHandoff(){
      const list=L.map(l=>({g:l.g,tx:l.tx,ty:l.ty,delay:l.delay,scale:l.s,sv:l.vs||0}));
      handoffNow(); // carries each letter's live throw velocity into the World
      // enter the World at bubble size (rest shape only — positions already placed), then grow
      for(const h of list)if(h.scale!==1)shrinkRest(h.g,h.scale);
      homing={list,steps:0,delayless:true};world.returning=list.length; // World.busy honours returning: no sleep while homing
    }
    function shrinkRest(g,k){
      g.w*=k;g.h*=k;g.radius*=k;
      for(const n of g.nodes){n.ox*=k;n.oy*=k;n.rx*=k;n.ry*=k}
      for(const ln of g.links)ln.length*=k;
    }
    function homeStep(){ // called by the main loop before each world.step()
      if(!homing)return;
      const ms=++homing.steps*STEP;let active=0;
      for(const h of homing.list){ // sway-b: grow back on an underdamped spring — swells past full size, then jiggles back
        if(h.scale!==1){h.sv+=(1-h.scale)*.05-h.sv*.18;let next=h.scale+h.sv;
          if(Math.abs(1-next)<.001&&Math.abs(h.sv)<.0005)next=1;
          world.scaleGlyph(h.g,next/h.scale);h.scale=next;active++}}
      for(const h of homing.list){
        if(h.done)continue;const g=h.g;
        if(world.drag?.glyph===g){h.done=true;continue} // grabbed: hands off for good
        const ramp=smooth(ms/120); // ease the steering in over the first few frames
        let vx=0,vy=0;for(const n of g.nodes){vx+=n.vx;vy+=n.vy}vx/=g.nodes.length;vy/=g.nodes.length;
        const dx=h.tx-g.cx,dy=h.ty-g.cy;
        // release when home, or when it has come to rest against a neighbour (the layout's
        // overlapping poses can make the exact spot unreachable — same as plain cc_v27)
        h.slow=Math.hypot(vx,vy)<.35?(h.slow||0)+1:0;
        if(!h.fade&&((Math.hypot(dx,dy)<4&&Math.hypot(vx,vy)<.5)||(ms>300&&h.slow>12)||ms>4000))h.fade=ms;
        const w=ramp*(h.fade?1-smooth((ms-h.fade)/300):1);if(w<=0){h.done=true;continue}
        active++;
        let ax=(dx*.012-vx*.05)*w,ay=(dy*.012-vy*.05)*w; // sway-b: half the steering brake, so they overshoot and swayconst am=Math.hypot(ax,ay);if(am>2.5){ax*=2.5/am;ay*=2.5/am}
        for(const n of g.nodes){n.vx+=ax;n.vy+=ay}
      }
      world.returning=active;if(!active)homing=null;
    }
    function cancelHome(){ // stale targets: stop steering, but never leave a letter undersized
      if(!homing)return;
      for(const h of homing.list)if(h.scale!==1&&world)world.scaleGlyph(h.g,1/h.scale);
      homing=null;if(world)world.returning=0;
    }
    // Projects opened mid-intro: pop the bubble if it's still up and hand the letters straight
    // to the World mid-flight (no throw arc, no homing) so the caller steers them at once.
    // Returns each letter's formation spot and full width (its "home") plus the bubble to flash.
    function popNow(){
      if(!api.active)return releaseHome();
      if(phase==='bubble')down({x:C.x,y:C.y});
      const ring={x:C.x,y:C.y,r:R},list=L.map(l=>({g:l.g,tx:l.tx,ty:l.ty,s:l.s}));
      handoffNow();
      for(const h of list)if(h.s!==1)shrinkRest(h.g,h.s);
      return {ring,list:list.map(h=>({g:h.g,tx:h.tx,ty:h.ty,w:h.g.w/h.s}))};
    }
    function releaseHome(){ // hand the post-pop homing to the caller without snapping sizes
      if(!homing)return null;
      const list=homing.list.map(h=>({g:h.g,tx:h.tx,ty:h.ty,w:h.g.w/h.scale}));
      homing=null;if(world)world.returning=0;
      return {ring:null,list};
    }

    /* Burst phase: per-letter springs to formation pose (underdamped → overshoot) */
    function stepBurst(){
      t+=STEP;const e=t-popT,rm=reduced.matches,fb=glass.ok&&glass.style()==='lg4';
      film=Math.max(0,1-e/(glass.ok?GLASS_MS:FILM_MS));
      if(glass.ok&&film>0)for(const p of M){ // glass splashes outward as it dissolves
        const dx=p.x-C.x,dy=p.y-C.y,d=Math.hypot(dx,dy)||1,v=R*.03*film;p.x+=dx/d*v;p.y+=dy/d*v}
      for(const p of M)if(!p.broken&&e>=p.breakAt){
        p.broken=true;
        if(!rm&&Math.random()<.7&&!(glass.ok&&glass.oil())){const dx=p.x-C.x,dy=p.y-C.y,d=Math.hypot(dx,dy)||1,v=rnd(2,5);
          drops.push({x:p.x,y:p.y,vx:dx/d*v,vy:dy/d*v,r:rnd(.8,2.2),life:1,hue:p.th*57.3})}
      }
      for(const d of drops){d.x+=d.vx;d.y+=d.vy;d.vx*=.95;d.vy=d.vy*.95+.06;d.life-=STEP/520}
      drops=drops.filter(d=>d.life>0);
      let settled=true,maxDelay=0,throwing=false;
      for(const l of L){
        maxDelay=Math.max(maxDelay,l.delay);
        if(fb){ // LG4 throw: an arc out of the burst toward its spot (ease-out); physics finishes it
          if(!l.kicked&&e>=l.delay){
            l.kicked=true;l.kt=e;
            const ux=Math.cos(l.dir),uy=Math.sin(l.dir),dist=Math.hypot(l.tx-l.x,l.ty-l.y),out=rm?0:R*rnd(.45,.75);
            l.f={x0:l.x,y0:l.y,cx:l.x+ux*out,cy:l.y+uy*out,s0:l.s,T:rm?400:clamp(420+dist*.3,480,820),
                 a0:Math.atan2(Math.sin(l.a),Math.cos(l.a))+(rm?0:rnd(.4,1)*(Math.random()<.5?-1:1))};
            l.E=[0,0,0];l.EV=[0,0,0];
          }
          const px=l.x,py=l.y,pa=l.a,ps=l.s;
          if(!l.kicked){l.vx*=.95;l.vy*=.95;l.x+=l.vx;l.y+=l.vy;throwing=true;continue}
          const f=l.f,tau=Math.min(1,(e-l.kt)/f.T),u=1-(1-tau)**3,iu=1-u;
          l.x=iu*iu*f.x0+2*u*iu*f.cx+u*u*l.tx;l.y=iu*iu*f.y0+2*u*iu*f.cy+u*u*l.ty;
          l.a=f.a0*iu;l.s=f.s0+(1-f.s0)*u;
          l.vx=l.x-px;l.vy=l.y-py;l.va=l.a-pa;l.vs=l.s-ps;
          if(tau<.3)throwing=true; // sway-b: hand off earlier, while still flying fast (was .55)
          continue;
        }
        if(!l.kicked&&e>=l.delay){
          l.kicked=true;l.kt=e;
          const ux=Math.cos(l.dir),uy=Math.sin(l.dir);
          l.vx+=ux*l.sp;l.vy+=uy*l.sp;
          if(!rm){l.va+=rnd(.05,.14)*(Math.random()<.5?-1:1);kickJelly(l,-uy,ux,.18)}
        }
        const w=l.kicked?smooth((e-l.kt-50)/220):0;
        const K=.02*w,Kd=(rm?.28:.13)*w+.012;
        l.vx+=K*(l.tx-l.x)-Kd*l.vx;l.vy+=K*(l.ty-l.y)-Kd*l.vy;l.x+=l.vx;l.y+=l.vy;
        l.a=Math.atan2(Math.sin(l.a),Math.cos(l.a));
        l.va+=.025*w*(-l.a)-((rm?.32:.12)*w+.02)*l.va;l.a+=l.va;
        l.vs+=.03*w*(1-l.s)-((rm?.35:.15)*w+.01)*l.vs;l.s+=l.vs;
        // jelly: stretch along velocity, springing back when it turns around
        const v=Math.hypot(l.vx,l.vy),mag=rm?0:Math.min(.3,v*.018),ux=v?l.vx/v:0,uy=v?l.vy/v:0;
        const T=[mag*(ux*ux-.45*uy*uy),mag*1.45*ux*uy,mag*(uy*uy-.45*ux*ux)];
        for(let i=0;i<3;i++){l.EV[i]=(l.EV[i]+(T[i]-l.E[i])*.16)*.86;l.E[i]=clamp(l.E[i]+l.EV[i],-.35,.35)}
        if(!l.kicked||Math.hypot(l.tx-l.x,l.ty-l.y)>.35||v>.08||Math.abs(l.a)>.002||Math.abs(l.va)>.001||
           Math.abs(1-l.s)>.002||Math.abs(l.vs)>.001||l.E.some(x=>Math.abs(x)>.003))settled=false;
      }
      if(fb){if(!throwing)launchHandoff();return}
      if((settled&&e>maxDelay+300&&!drops.length)||e>6000)finish();
    }

    /* LG4: hand off mid-flight. Each letter's on-screen pose (position, rotation,
       scale, squish) and velocity are written into its main-world nodes; the World's
       own shape recovery then springs it back to full size. No home force exists in
       the physics, so letters stay wherever they were when touched. */
    function handoffNow(){
      for(const l of L){
        const co=Math.cos(l.a),si=Math.sin(l.a),[xx,xy,yy]=l.E,s=l.s;
        const m00=((1+xx)*co+xy*si)*s,m01=(-(1+xx)*si+xy*co)*s,m10=(xy*co+(1+yy)*si)*s,m11=(-xy*si+(1+yy)*co)*s;
        for(const n of l.g.nodes){
          const rx=n.x-l.tx,ry=n.y-l.ty,x=l.x+m00*rx+m01*ry,y=l.y+m10*rx+m11*ry;
          n.x=x;n.y=y;n.vx=(l.vx||0)-(l.va||0)*(y-l.y);n.vy=(l.vy||0)+(l.va||0)*(x-l.x);
        }
        l.g.update();
      }
      finish();
    }

    /* Handoff: world nodes were never moved, so identity transform == draw() */
    function finish(){
      api.active=false;cancelAnimationFrame(raf);raf=0;
      L=[];M=[];drops=[];canvas.classList.remove('pop');if(glass.ok)glass.hide();
      renderDirty=true;draw();wake();
    }

    /* Rendering */
    function membranePath(scale=1){
      const c=scale===1?null:centroid(),path=new Path2D();
      const P=i=>{const p=M[(i+N)%N];return c?{x:c.x+(p.x-c.x)*scale,y:c.y+(p.y-c.y)*scale}:p};
      const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
      let s=mid(P(-1),P(0));path.moveTo(s.x,s.y);
      for(let i=0;i<N;i++){const e=mid(P(i),P(i+1)),p=P(i);path.quadraticCurveTo(p.x,p.y,e.x,e.y)}
      path.closePath();return path;
    }
    function rimPath(){ // only unbroken film segments
      const path=new Path2D(),mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});let open=false;
      for(let i=0;i<N;i++){const p=M[i];
        if(p.broken){open=false;continue}
        const s=mid(M[(i-1+N)%N],p),e=mid(p,M[(i+1)%N]);
        if(!open){path.moveTo(s.x,s.y);open=true}
        path.quadraticCurveTo(p.x,p.y,e.x,e.y);
      }
      return path;
    }
    function filmGradient(c){
      const ang=t/2400;
      if(ctx.createConicGradient){
        const g=ctx.createConicGradient(ang,c.x,c.y);
        [[0,'rgba(231,0,106,.55)'],[.2,'rgba(255,190,70,.5)'],[.4,'rgba(110,220,190,.5)'],
         [.6,'rgba(90,150,255,.55)'],[.8,'rgba(190,110,255,.5)'],[1,'rgba(231,0,106,.55)']].forEach(([o,col])=>g.addColorStop(o,col));
        return g;
      }
      const g=ctx.createLinearGradient(c.x-R,c.y-R,c.x+R,c.y+R);
      g.addColorStop(0,'rgba(231,0,106,.5)');g.addColorStop(.5,'rgba(110,220,190,.5)');g.addColorStop(1,'rgba(90,150,255,.5)');
      return g;
    }
    function drawLetter(l){
      const co=Math.cos(l.a),si=Math.sin(l.a),[xx,xy,yy]=l.E,s=l.s;
      const m00=((1+xx)*co+xy*si)*s,m01=(-(1+xx)*si+xy*co)*s,m10=(xy*co+(1+yy)*si)*s,m11=(-xy*si+(1+yy)*co)*s;
      ctx.save();
      ctx.setTransform(ratio*m00,ratio*m10,ratio*m01,ratio*m11,
        ratio*(l.x-(m00*l.tx+m01*l.ty)),ratio*(l.y-(m10*l.tx+m11*l.ty)));
      drawSolid(l.g,l.rest);
      ctx.restore();
    }
    function render(){
      ctx.setTransform(ratio,0,0,ratio,0,0);
      ctx.fillStyle='#f4f2ed';ctx.fillRect(0,0,width,height);
      const c=centroid(),f=phase==='bubble'?1:film;
      if(f>0&&!glass.ok){ // film body behind the letters
        const body=membranePath(),g=ctx.createRadialGradient(c.x-R*.3,c.y-R*.35,R*.1,c.x,c.y,R*1.05);
        g.addColorStop(0,`rgba(255,255,255,${.28*f})`);g.addColorStop(.75,`rgba(240,236,250,${.12*f})`);g.addColorStop(1,`rgba(214,206,236,${.3*f})`);
        ctx.fillStyle=g;ctx.fill(body);
      }
      if(W2)for(const g2 of [...W2.glyphs].sort((a,b)=>(L[a.index].g.z||0)-(L[b.index].g.z||0)))drawSolid(g2,prepareLetter(g2));
      else for(const l of [...L].sort((a,b)=>(a.g.z||0)-(b.g.z||0)))drawLetter(l);
      if(!glass.ok&&(f>0||phase==='bubble')){
        const rim=phase==='bubble'?membranePath():rimPath();
        ctx.save();ctx.lineCap='round';
        ctx.globalAlpha=phase==='bubble'?1:Math.min(1,f*2);
        ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=7;ctx.stroke(rim);
        ctx.strokeStyle=filmGradient(c);ctx.lineWidth=2.2;ctx.stroke(rim);
        ctx.strokeStyle='rgba(70,40,80,.16)';ctx.lineWidth=.8;ctx.stroke(rim);
        if(phase==='bubble'){ // specular highlights
          ctx.globalAlpha=1;ctx.translate(c.x-R*.45,c.y-R*.5);ctx.rotate(-.75);
          const hg=ctx.createRadialGradient(0,0,0,0,0,R*.22);
          hg.addColorStop(0,'rgba(255,255,255,.75)');hg.addColorStop(1,'rgba(255,255,255,0)');
          ctx.scale(1,.36);ctx.fillStyle=hg;ctx.beginPath();ctx.arc(0,0,R*.22,0,Math.PI*2);ctx.fill();
          ctx.setTransform(ratio,0,0,ratio,0,0);
          ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(c.x-R*.22,c.y-R*.7,R*.025,0,Math.PI*2);ctx.fill();
        }
        ctx.restore();
      }
      if(phase==='burst'){ // rupture flash + droplets
        const e=t-popT;
        if(e<260&&!glass.ok){ctx.save();ctx.globalAlpha=.35*(1-e/260);ctx.strokeStyle=filmGradient(c);ctx.lineWidth=1.5;
          ctx.stroke(membranePath(1+e/260*.15));ctx.restore()}
        for(const d of drops){
          if(glass.ok){ // clear glass beads: faint body, dark edge, white glint
            ctx.beginPath();ctx.arc(d.x,d.y,d.r*1.4,0,Math.PI*2);
            ctx.fillStyle=`rgba(255,255,255,${d.life*.55})`;ctx.fill();
            ctx.strokeStyle=`rgba(60,50,70,${d.life*.25})`;ctx.lineWidth=.8;ctx.stroke();
            ctx.fillStyle=`rgba(255,255,255,${d.life})`;ctx.beginPath();ctx.arc(d.x-d.r*.45,d.y-d.r*.45,d.r*.45,0,Math.PI*2);ctx.fill();
          } else {ctx.fillStyle=`hsla(${d.hue},85%,62%,${d.life*.8})`;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill()}
        }
      }
      if(glass.ok){if(f>0||glass.busy())glass.draw(c,f);else glass.hide()}
    }

    function loop(time){
      raf=0;if(!api.active)return;
      if(document.hidden){prev=0;return}
      acc+=prev?Math.min(time-prev,MAX_DELTA):STEP;prev=time;
      let n=0;
      while(acc>=STEP&&n<MAX_STEPS){phase==='bubble'?stepBubble():stepBurst();acc-=STEP;n++;if(!api.active)return}
      render();raf=requestAnimationFrame(loop);
    }

    function move(pt){
      if(phase!=='bubble')return;
      pointer=pt;if(pt)lastPtr=pt;const over=!!pt&&inside(pt);canvas.classList.toggle('pop',over);
      const lr=ripples.at(-1);
      if(over&&(!lr||Math.hypot(pt.x-lr.x,pt.y-lr.y)>R*.12||t-lr.t0>400))ripples.push({x:pt.x,y:pt.y,t0:t,amp:.45});
    }

    document.addEventListener('visibilitychange',()=>{
      if(!api.active)return;
      if(document.hidden){cancelAnimationFrame(raf);raf=0;prev=0;acc=0}
      else if(!raf&&L.length){prev=0;raf=requestAnimationFrame(loop)}
    });

    return Object.assign(api,{attach,down,move,homeStep,cancelHome,popNow,releaseHome});
  })();

  /* ── Init ────────────────────────────────────────────────────────────── */
  new ResizeObserver(resize).observe(canvas);
  resize();

  Promise.all(ALL_SVGS.map(url=>SvgLoader.loadSvgInfo(url)))
    .then(infos => {
      cachedInfos=infos;
      logDiagnostics();
      currentComp=pickComp(width, height);
      console.log(`[cc_v12] initial layout: "${COMPS[currentComp].name}" for ${width}×${height}`);
      build(currentComp);
    })
    .catch(err => console.error('[cc_v12]', err));
})();

/* ── Info modal + Projects sheet (only one open at a time) ──────────── */
(() => {
  const about    = document.getElementById('about');
  const infoBtn  = document.getElementById('info-btn');
  const projects = document.getElementById('projects');
  const projBtn  = document.getElementById('projects-btn');
  const sheet    = projects.querySelector('.sheet');
  const stage    = window.ProjectStage;
  let infoOpen = false, projOpen = false;
  function toggleInfo(open = !infoOpen) {
    if (open && projOpen) toggleProjects(false);
    infoOpen = open;
    about.classList.toggle('open', open);
    about.setAttribute('aria-hidden', String(!open));
    infoBtn.textContent = open ? 'Close' : 'Info';
  }
  function toggleProjects(open = !projOpen) {
    if (open && infoOpen) toggleInfo(false);
    projOpen = open;
    projects.classList.toggle('open', open);
    projects.setAttribute('aria-hidden', String(!open));
    projects.inert = !open;
    open ? stage.open() : stage.close(); // the letters make room (or come home)
    projBtn.textContent = open ? 'Close' : 'Projects';
    projBtn.setAttribute('aria-expanded', String(open));
  }
  infoBtn.addEventListener('click', () => toggleInfo());
  projBtn.addEventListener('click', () => toggleProjects());
  about.addEventListener('click', e => { if (e.target === about) toggleInfo(false); });
  // scrolling the list sways the letters
  let lastScroll = 0;
  sheet.addEventListener('scroll', () => { const y = sheet.scrollTop; stage.scrollSway(y - lastScroll); lastScroll = y; }, { passive: true });
  // test-only: how letters that must swap places get past each other (mirrored in the URL hash)
  const styleBtns = [...document.querySelectorAll('#styles button')];
  const syncStyles = () => styleBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.style === stage.style())));
  styleBtns.forEach(b => b.addEventListener('click', () => { stage.setStyle(b.dataset.style); syncStyles(); }));
  window.addEventListener('hashchange', () => { stage.setStyle(location.hash.slice(1)); syncStyles(); });
  syncStyles();
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (infoOpen) toggleInfo(false);
    if (projOpen) toggleProjects(false);
  });
})();
</script>
